# system_map_overrides.yaml
# Manuelle Korrekturen haben Priorität über Auto-Status des Generators.
# Format: status_overrides, duplicate_groups, orphan_overrides

status_overrides:
  - id: "module:accounting.ledger"
    status: "yellow"
    reason: "0 Unit-Tests, aber produktiv via Evidence-Pack verdrahtet"

  - id: "module:paper.paper_broker"
    status: "orange"
    reason: "verdrahtet, aber 0 dedizierte Tests — Behaviour nur via Integration sichtbar"

duplicate_groups:
  - id: "dup:backtest_engines"
    label: "4 Backtest-Engines"
    reason: "Historische Parallelentwicklung — konsolidieren auf pipeline.backtest oder qa.backtest_engine"
    members:
      - "module:qa.backtest_engine"
      - "module:qa.backtest_engine_numba"
      - "module:pipeline.backtest"
      - "module:pipeline.backtest_legacy"

  - id: "dup:paper_engines"
    label: "2 Paper-Engines"
    reason: "execution/paper_trading_engine (alt) vs. execution/unified_paper_engine (neu) — Migration abschließen"
    members:
      - "module:execution.paper_trading_engine"
      - "module:execution.unified_paper_engine"

  - id: "dup:news_paths"
    label: "3 News-Pfade"
    reason: "Drei parallele News-Ingestion-Routen — events/news/, intel/news_*.py, data/news_ingest.py"
    members:
      - "module:events.news_enricher"
      - "module:intel.news_classifier"
      - "module:data.news_ingest"

  - id: "dup:regime_modules"
    label: "6 Regime-Module"
    reason: "Regime-Logik über 4 Domänen verteilt — zentralisieren in risk oder ml"
    members:
      - "module:ml.regime_hmm"
      - "module:ml.tda_regime"
      - "module:risk.regime_analysis"
      - "module:risk.regime_costs"
      - "module:risk.regime_models"
      - "module:portfolio.regime_portfolio"

orphan_overrides: []

# ── Meta-Galaxien (5 super-cluster über den 22 Domänen) ──────────────
# Bei Galaxy-Zoom erscheinen nur diese 5 Rechtecke. Zoom-in offenbart Domänen.
# Jede Domäne gehört zu höchstens einer Galaxie. Nicht-gemappte Domänen
# landen in "UNMAPPED" und erscheinen hart separiert — sichtbares Signal,
# dass die Taxonomie unvollständig ist.
galaxies:
  - id: "galaxy:market"
    label: "MARKET"
    purpose: "Rohdaten, Features, Signale, News, Intel — alles was vor der Entscheidung passiert."
    domains: [data, features, signals, events, intel]

  - id: "galaxy:alpha"
    label: "ALPHA"
    purpose: "Strategie-Konstruktion, Portfolio-Aggregation, ML-Modelle."
    domains: [strategies, portfolio, ml]

  - id: "galaxy:execution"
    label: "EXECUTION"
    purpose: "Order-Generierung, Paper/Live-Engines, Pipeline, Risk, Accounting."
    domains: [execution, paper, pipeline, risk, accounting]

  - id: "galaxy:assurance"
    label: "ASSURANCE"
    purpose: "QA, Compliance, Reports, Experiments — alles was prüft und dokumentiert."
    domains: [qa, compliance, reports, experiments]

  - id: "galaxy:infra"
    label: "INFRA"
    purpose: "API, Ops, Config, Utils — Laufzeit-Substrat."
    domains: [api, ops, config, utils]
