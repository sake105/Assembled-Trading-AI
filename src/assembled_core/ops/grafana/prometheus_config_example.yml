## Prometheus scrape configuration example for Assembled-Trading-AI
##
## Use this as a starting point for prometheus.yml.
## The .prom file written by metrics_exporter.py is read via file_sd_configs
## or a Pushgateway depending on your deployment.

global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:

  ## Option A: File-based scrape (no Pushgateway needed).
  ## Prometheus reads the .prom file directly — works for single-host setups.
  - job_name: assembled_trading_file
    honor_labels: true
    file_sd_configs:
      - files:
          - output/metrics/*.prom
        refresh_interval: 60s

  ## Option B: Pushgateway (multi-host / Docker / CI).
  ## Set env var ASSEMBLED_PROM_PUSHGATEWAY_URL=http://localhost:9091
  ## before running the trading pipeline. The metrics_exporter will push.
  - job_name: assembled_trading_pushgateway
    honor_labels: true
    static_configs:
      - targets: ["localhost:9091"]

