repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.env|
            .*\.lock|
            .*\.parquet|
            .*\.db|
            CHANGELOG_DUE_DILIGENCE\.md|
            \.secrets\.baseline
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-bare-assert
        name: no bare assert in src (assert without message)
        language: pygrep
        entry: '^\s*assert [^,\n]+$'
        files: '^src/'
        types: [python]
