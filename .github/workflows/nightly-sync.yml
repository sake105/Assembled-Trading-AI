# Nightly heartbeat/sync workflow
#
# Purpose: Daily heartbeat commit to track repository activity
# Triggers: Scheduled (01:30 UTC daily) + manual dispatch
# Status: Active - lightweight maintenance workflow
name: Nightly Auto Sync

on:
  schedule:
    # Runs daily at 01:30 UTC (≈ 03:30 Europe/Berlin in Sommerzeit, 02:30 im Winter)
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write  # allow pushing commits

concurrency:
  group: nightly-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Heartbeat DISABLED (C6 audit 2026-04-26) — was generating ~200 noise commits.
      # Re-enable by restoring the Write heartbeat + Commit & Push steps.
      - name: Heartbeat disabled
        run: echo "Heartbeat commits disabled. No commit will be pushed."
