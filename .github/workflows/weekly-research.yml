# Runs walk-forward and GARCH forecast weekly
name: weekly-research
on:
  schedule:
    - cron: "0 6 * * 6"  # 06:00 UTC Saturday
  workflow_dispatch: {}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward validation
        run: python scripts/ci/walk_forward_check.py || echo "walk-forward step failed"
      - name: GARCH vol forecast
        run: python scripts/ci/garch_check.py || echo "GARCH step failed"
      - name: Retraining scheduler check
        run: python scripts/ci/retraining_check.py || echo "retraining check failed"
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-${{ github.run_id }}
          path: output/qa/
          retention-days: 30
          if-no-files-found: warn
