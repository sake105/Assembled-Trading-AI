# Runs walk-forward and GARCH forecast weekly
name: weekly-research
on:
  schedule:
    - cron: "0 6 * * 6"  # 06:00 UTC Saturday
  workflow_dispatch: {}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward validation
        run: python scripts/run_walk_forward.py --strategy multifactor_v2 || echo "walk-forward skipped (no panel)"
      - name: GARCH vol forecast
        run: python -c "
from src.assembled_core.features.garch_vol import compute_garch_forecast
print('[garch] module available')
" || echo "GARCH skipped"
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-${{ github.run_id }}
          path: output/qa/
          retention-days: 30
          if-no-files-found: warn
