# Release gate CI: non-blocking on PRs, blocking on push to main
#
# Runs release_sprint13 dry-run always; full release_sprint13 preset blocking only on push to main.
# Artifact: release_gate_log.txt always uploaded.
name: Release Gate CI (Windows)

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  windows-release-gate:
    name: Release Gate (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # CI-002: was an ad-hoc minimal list that omitted PyYAML. The release
        # gate now runs trading-numeric tests that import src/pipeline ->
        # config.policy_loader, which does `import yaml` at module top, so the
        # env must include PyYAML. Use requirements.txt (PyYAML==6.0.3) — the
        # same install the walk-forward-gate job below already uses; this also
        # drops the unpinned-ad-hoc-list drift for this job.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Release gate dry-run (always)
        id: dry_run
        run: |
          $out = python scripts/dev/release_sprint13.py --dry-run 2>&1
          if ($null -eq $out -or $out -eq "") { "No output captured" | Set-Content -Path release_gate_log.txt -Encoding utf8 } else { $out | Set-Content -Path release_gate_log.txt -Encoding utf8 }
          Write-Output $out

      - name: Release gate full (blocking on push to main)
        id: release_gate
        continue-on-error: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
        run: |
          $out = python scripts/dev/release_sprint13.py 2>&1
          $exitCode = $LASTEXITCODE
          if ($null -eq $out -or $out -eq "") { "No output captured" | Add-Content -Path release_gate_log.txt -Encoding utf8 } else { $out | Add-Content -Path release_gate_log.txt -Encoding utf8 }
          Write-Output $out
          echo "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Write job summary
        if: always()
        run: |
          $ec = "${{ steps.release_gate.outputs.exit_code }}"
          if ($ec -eq "0") { $status = "PASS" } else { $status = "FAIL" }
          echo "release_sprint13: $status" >> $env:GITHUB_STEP_SUMMARY
          echo "Docs: [MERGE_GATE_SPRINT13.md](docs/MERGE_GATE_SPRINT13.md)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload release_gate_log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-log
          path: release_gate_log.txt
          if-no-files-found: ignore

  walk-forward-gate:
    # CI-001 — HONEST SCOPE. This is a SYNTHETIC smoke run, not a real release
    # gate. The script runs on synthetic random-walk prices (5 symbols x 500
    # business days, seed=42); the E3 (OOS Sharpe) and E4 (Deflated Sharpe)
    # statistical gates are evaluated against that synthetic series and CANNOT
    # certify the real strategy. Genuine real-data gating needs the E5 fixture
    # (~30 Paper-Days of Alpaca fills), which is user-gated on GitHub Secrets.
    #
    # What this job DOES enforce: execution INTEGRITY. The script now exits 2
    # (always blocking, independent of --enforce / grace) if the walk-forward
    # run is structurally broken — no splits generated, some splits crash and
    # are silently dropped, or the DSR input is degenerate. That catches an
    # engine/data regression even on synthetic data.
    #
    # What stays NON-blocking: an E3/E4 statistical miss on the synthetic
    # series. --enforce is deliberately NOT passed here; turning it on
    # against synthetic data would either be vacuous-green or CI-red on a
    # meaningless number. W14 re-evaluation 2026-07-22 (GESAMTBEWERTUNG):
    # the old "grace through 2026-07-01" date expired — the decision is now
    # CONDITION-based, not date-based: E3/E4 stay non-blocking UNTIL the E5
    # real-price fixture (~30 paper days of Alpaca fills, user-gated on
    # GitHub Secrets) exists; then flip to --enforce on real data. Job KEY
    # kept as `walk-forward-gate` to preserve any branch-protection
    # required-check wiring.
    name: Walk-Forward Smoke (synthetic data; integrity blocks, E3/E4 non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run walk-forward smoke (synthetic; integrity blocks on exit 2)
        run: python scripts/release_gate_walk_forward.py --verbose

      - name: Upload walk-forward report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-gate
          path: output/qa/release_gate/
          if-no-files-found: ignore
