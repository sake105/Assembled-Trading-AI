name: Nightly RunAll

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  runall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip --quiet
          if (Test-Path requirements.txt) { .\.venv\Scripts\pip install -r requirements.txt --quiet }
          .\.venv\Scripts\pip install -e . --no-deps --quiet

      - name: Nightly smoke-test
        shell: pwsh
        run: .\.venv\Scripts\python scripts/ci/nightly_smoke.py
