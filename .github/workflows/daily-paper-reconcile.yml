name: daily-paper-reconcile

# Plan 11/10 §3.1.2 + §3.2.2 — Daily paper-trading reconciliation + sim-to-real gap report.
# Runs at 21:30 UTC = 16:30 ET (after market close) on weekdays.

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-paper-reconcile
  cancel-in-progress: false

jobs:
  reconcile-and-report:
    name: Reconcile + Gap Report
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run reconciliation
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          # broker_adapter.py reads ALPACA_API_SECRET (canonical, src/);
          # GitHub Secret is also stored under ALPACA_API_SECRET.
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          # OPS-07: the exit code is no longer neutralized. The previous
          # `--dry-run || true` (a) passed an arg the worker never defined and
          # (b) swallowed EVERY exit code, so a reconcile break (e.g. the
          # 2026-04-10 $412.54 silent stall) kept this job green. `|| true` and
          # the bogus `--dry-run` are removed so a genuine worker failure now
          # fails this job.
          #
          # NOTE (honest scope): this step still runs with EMPTY ledger/broker
          # inputs — it is a plumbing/import smoke check, NOT yet a real
          # sim-to-real gap gate. The worker now supports --halt-on-mismatch
          # (fail-closed, exit 2 on a real mismatch / exit 3 on absent inputs);
          # wiring this workflow to the real paper ledger + a live Alpaca broker
          # snapshot so the halt actually bites is a bounded follow-up
          # (OPS-13-adjacent: resolve the JSON-vs-SQLite ledger source first).
          python scripts/run_reconcile_worker.py

      - name: Generate QA report
        run: |
          python scripts/generate_daily_qa_report.py \
            --out output/qa_report_$(date +%Y%m%d).json

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ github.run_id }}
          path: output/qa_report_*.json
          if-no-files-found: warn
          retention-days: 30
