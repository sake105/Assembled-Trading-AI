# Runs feature-drift and leakage checks daily after market close
name: daily-diagnostics
on:
  schedule:
    - cron: "0 22 * * 1-5"  # 22:00 UTC Mon-Fri
  workflow_dispatch: {}
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Feature drift check
        run: python scripts/ci/drift_check.py
      # Audit-Plan 3.2 (2026-08-17): der alte Step rief ein NICHT existierendes
      # Script mit `|| echo` auf — ein No-op seit Einfuehrung. Der Runner hat
      # keine Produktionsdaten (output/ gitignored); der echte Daten-Check
      # laeuft seit Audit-Plan 3.1 taeglich lokal im Orchestrator (Gate 8).
      # Hier laeuft stattdessen der Detektor-SELBSTTEST (fail-drill-Muster):
      # praepariertes Leak MUSS blocken, sauberes Frame MUSS ok sein. Kein
      # `|| echo` mehr — ein defekter Detektor macht den Job ROT.
      - name: Leakage detector selftest
        run: python scripts/ci/leakage_detector_selftest.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: output/qa/
          retention-days: 7
          if-no-files-found: warn
