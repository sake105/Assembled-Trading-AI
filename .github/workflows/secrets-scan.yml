name: secrets-scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  detect-secrets:
    name: detect-secrets audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Audit baseline against current tree
        run: |
          set -o pipefail
          detect-secrets scan \
            --exclude-files '\.env$|\.lock$|\.parquet$|\.db$|\.venv/|output/|data/|\.git/|CHANGELOG_DUE_DILIGENCE\.md$|\.secrets\.baseline$' \
            | python -c "
import json, sys
current = json.load(sys.stdin).get('results', {})
with open('.secrets.baseline') as f:
    baseline = json.load(f).get('results', {})

# Any file in current that is NOT in baseline is a NEW finding
new_findings = {}
for path, items in current.items():
    baseline_items = baseline.get(path, [])
    baseline_hashes = {i.get('hashed_secret') for i in baseline_items}
    new = [i for i in items if i.get('hashed_secret') not in baseline_hashes]
    if new:
        new_findings[path] = new

if new_findings:
    print('NEW secret findings detected (not in baseline):')
    for path, items in new_findings.items():
        print(f'  {path}: {len(items)} new finding(s)')
        for item in items:
            print(f'    line {item.get(\"line_number\")}: {item.get(\"type\")}')
    sys.exit(1)

print('No new secret findings. Baseline-aligned.')
"
