# GitHub Actions CI workflow for Assembled Trading AI Backend
#
# Purpose: Main CI workflow for Python backend testing, linting, and type checking
# Triggers: Push/PR to main and feature/* branches
# Status: Active - primary CI workflow for backend validation
name: Backend CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      
      - name: Initialize backend CI log
        run: echo "Backend CI started at $(date -Iseconds)" > backend_ci_log.txt
      
      - name: Run backend core tests (fast marker) with coverage
        run: |
          set -o pipefail
          # F-risk-1: migrated from (phase4..phase11) to canonical `fast` marker.
          # phase4..phase13 markers were removed from pyproject.toml in commit 9b78eed.
          # pyproject.toml filterwarnings already promotes warnings from
          # src.assembled_core.* to errors (targeted). Removing the blanket
          # -W error avoids cascading failures from third-party packages
          # (pandas pct_change FutureWarning, arch/matplotlib/pyparsing
          # DeprecationWarning) that were accumulated while backend-ci was
          # broken and hidden by exit-127 (missing pytest in requirements.txt).
          pytest -m "fast and not slow" -q --maxfail=1 \
            --cov=src/assembled_core --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=0 2>&1 | tee -a backend_ci_log.txt

      - name: Run regression gates
        run: |
          set -o pipefail
          # F-risk-1: phase12 marker removed; regression marker subsumes it.
          pytest -m "regression and not slow" -q --maxfail=1 2>&1 | tee -a backend_ci_log.txt
      
      - name: Security scan — dependency vulnerabilities (pip-audit)
        run: |
          set -o pipefail
          pip install pip-audit
          # Blocking scan. Known-accepted CVEs in transitive/tooling deps are
          # ignored with explicit rationale; any NEW vulnerability fails CI.
          #
          # ── IGNORE-LIST REVIEW DATE: review by 2026-09-01 ──
          # Every --ignore-vuln entry below is a temporary accepted-risk waiver,
          # NOT a permanent exception. Re-audit each entry on the review date:
          # confirm the rationale still holds or remove the waiver so the CVE
          # re-blocks CI. Prefer dependency upgrades over indefinite ignores.
          # RESOLVED (CVE-2024-47081, requests): `requests` upgraded to 2.32.4
          # (fixes the .netrc credential leak); the corresponding --ignore-vuln
          # line has been removed.
          # RESOLVED (CVE-2026-25645 / PYSEC-2026-2275, requests): upgraded to
          #   2.33.0 (2026-07-23); waiver removed (real fix).
          # RESOLVED (PYSEC-2026-141/142 = CVE-2026-44431/44432, urllib3):
          #   upgraded to 2.7.0 (2026-07-23); both waivers removed (real fix).
          # RESOLVED (PYSEC-2026-113 / CVE-2026-25087 / GHSA-rgxp-2hwp-jwgg,
          #   pyarrow use-after-free): upgraded 21.0.0 -> 23.0.1 (2026-07-23);
          #   waiver removed (real fix). This advisory (published ~2026-07)
          #   was the 2026-07-23 CI blocker: the old waiver line matched the
          #   PYSEC id but the audit surfaced the GHSA/CVE alias on a pinned
          #   21.0.0 with no fixed release below 23.0.1.
          #
          # Toolchain / pip:
          # - CVE-2025-8869, CVE-2026-1703, CVE-2026-3219, CVE-2026-6357 (pip):
          #   toolchain only, not shipped in any production artifact
          # Transitive network/HTTP deps:
          # - CVE-2026-33752 (curl-cffi): transitive, not in runtime call path
          # - CVE-2026-45409 (idna): IDNA 2008 parsing edge-case; project does not
          #   process untrusted hostnames from user input
          # Formatting / docs tools:
          # - CVE-2026-4539 (pygments): docs/formatting only
          # - CVE-2026-32274 (black): formatting tool, not in runtime call path
          # Config / templating:
          # - CVE-2026-28684 (python-dotenv): symlink attack on .env write; .env
          #   files are read-only in this project (no programmatic write path)
          # - CVE-2026-44307 (mako): transitive templating dep, not directly imported
          # RESOLVED (starlette): PYSEC-2026-161, PYSEC-2026-248, PYSEC-2026-249,
          #   CVE-2026-48817, CVE-2026-48818 are all fixed in starlette >=1.3.1
          #   (PYSEC-2026-161 fixed in 1.0.1, per OSV). fastapi upgraded
          #   0.122.0 -> 0.139.0 (dropped the starlette<0.51 cap) and starlette
          #   is pinned ==1.3.1 in requirements.txt; the 5 starlette
          #   --ignore-vuln lines were removed (real fix, no longer waived).
          # RESOLVED (GHSA-4xgf-cpjx-pc3j, pydantic-settings): upgraded 2.12.0 ->
          #   2.14.2 in requirements.txt; no waiver needed.
          pip-audit --desc --skip-editable \
            --ignore-vuln CVE-2026-33752 \
            --ignore-vuln CVE-2025-8869 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-45409 \
            --ignore-vuln CVE-2026-32274 \
            --ignore-vuln CVE-2026-28684 \
            --ignore-vuln CVE-2026-44307 \
            2>&1 | tee -a backend_ci_log.txt

      - name: Security scan — code analysis (bandit)
        run: |
          set -o pipefail
          pip install bandit
          # Blocking scan for medium+ severity findings. Config in pyproject.toml
          # [tool.bandit] governs skips and exclusions with documented rationale.
          bandit -r src/assembled_core -c pyproject.toml --severity-level medium -q 2>&1 | tee -a backend_ci_log.txt

      - name: Run ruff (linting)
        run: |
          set -o pipefail
          ruff check src tests scripts --exclude scripts/tools --exclude scripts/00_seed_demo_data.py 2>&1 | tee -a backend_ci_log.txt
      
      - name: Run ruff-format (format check)
        run: |
          set -o pipefail
          ruff format --check src tests scripts --exclude scripts/tools --exclude scripts/00_seed_demo_data.py 2>&1 | tee -a backend_ci_log.txt
      
      - name: Run mypy (type checking)
        run: |
          set -o pipefail
          # mypy is a BLOCKING gate: any type error fails the job (mypy 1.19.0 pinned).
          # Scope history: 134-error backlog cleared 2026-06 (5 paths); risk/ (40 errors)
          # + paper/ (4 errors) swept to zero and added 2026-07-25 (GESAMTBEWERTUNG §8
          # Tranche 1; behaviour-neutral type fixes only, 1230 neighbourhood tests green,
          # 2 potential real bugs flagged as FIXME(mypy-sweep) instead of silently "fixed").
          # Still unscoped: qa (132), pipeline (131), ops (123), api (79)
          # — next tranches per §8 (ops/api -> pipeline/qa). accounting/ (16 errors,
          # fresh-cache count per E-057) swept to zero and added 2026-07-26
          # (Tranche 2; behaviour-neutral type fixes only, 502 neighbourhood tests green).
          mypy src/assembled_core/data src/assembled_core/features src/assembled_core/signals src/assembled_core/execution src/assembled_core/portfolio src/assembled_core/risk src/assembled_core/paper src/assembled_core/accounting 2>&1 | tee -a backend_ci_log.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload backend CI log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: backend_ci_log.txt
          if-no-files-found: ignore

