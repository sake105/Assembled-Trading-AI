# GitHub Actions CI workflow for Assembled Trading AI Backend
#
# Purpose: Main CI workflow for Python backend testing, linting, and type checking
# Triggers: Push/PR to main and feature/* branches
# Status: Active - primary CI workflow for backend validation
name: Backend CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Initialize backend CI log
        run: echo "Backend CI started at $(date -Iseconds)" > backend_ci_log.txt
      
      - name: Run backend core tests (all phases) with coverage
        run: |
          set -o pipefail
          pytest -m "(phase4 or phase6 or phase7 or phase8 or phase9 or phase10 or phase11) and not slow" -q --maxfail=1 -W error \
            --cov=src/assembled_core --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=0 2>&1 | tee -a backend_ci_log.txt

      - name: Run phase12 + regression gates
        run: |
          set -o pipefail
          pytest -m "(phase12 or regression) and not slow" -q --maxfail=1 2>&1 | tee -a backend_ci_log.txt
      
      - name: Security scan — dependency vulnerabilities (pip-audit)
        run: |
          set -o pipefail
          pip install pip-audit
          # Blocking scan. Known-accepted CVEs in transitive/tooling deps are
          # ignored with explicit rationale; any NEW vulnerability fails CI.
          # - CVE-2026-33752 (curl-cffi): transitive, not in runtime call path
          # - CVE-2025-8869, CVE-2026-1703 (pip): toolchain only, not shipped
          # - CVE-2026-4539 (pygments): docs/formatting only
          # - CVE-2026-25645 (requests): upgrade tracked in Sprint 4 dep refresh
          pip-audit --desc --skip-editable \
            --ignore-vuln CVE-2026-33752 \
            --ignore-vuln CVE-2025-8869 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-25645 \
            2>&1 | tee -a backend_ci_log.txt

      - name: Security scan — code analysis (bandit)
        run: |
          set -o pipefail
          pip install bandit
          # Blocking scan for medium+ severity findings. Config in pyproject.toml
          # [tool.bandit] governs skips and exclusions with documented rationale.
          bandit -r src/assembled_core -c pyproject.toml --severity-level medium -q 2>&1 | tee -a backend_ci_log.txt

      - name: Run ruff (linting)
        run: |
          set -o pipefail
          ruff check src tests scripts --exclude scripts/tools --exclude scripts/00_seed_demo_data.py 2>&1 | tee -a backend_ci_log.txt
      
      - name: Run black (format check)
        run: |
          set -o pipefail
          black --check src tests scripts --exclude "/(scripts/tools|scripts/00_seed_demo_data.py)/" 2>&1 | tee -a backend_ci_log.txt
      
      - name: Run mypy (type checking)
        run: |
          set -o pipefail
          mypy src/assembled_core/data src/assembled_core/features src/assembled_core/signals src/assembled_core/execution src/assembled_core/portfolio 2>&1 | tee -a backend_ci_log.txt || true
        continue-on-error: true  # mypy is optional for now
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload backend CI log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: backend_ci_log.txt
          if-no-files-found: ignore

