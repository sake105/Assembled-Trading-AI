# GitHub Actions CI Workflow - Minimal
#
# Purpose: Minimal CI workflow to prevent PR regressions
# Triggers: Push/PR to main and feature/* branches
# Status: Active - fast feedback for PRs
name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python_cmd: python
          - os: windows-latest
            python_cmd: "py -3"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Initialize CI log
        shell: bash
        run: echo "CI started at $(date -Iseconds)" > ci_log.txt
      
      - name: Run ruff (linting)
        shell: bash
        run: |
          set -o pipefail
          ruff check src tests scripts --exclude scripts/tools --exclude scripts/00_seed_demo_data.py 2>&1 | tee -a ci_log.txt
      
      # SSOT: run_checks.py holds compile excludes; Windows uses py -3 to avoid Store stub
      - name: Check Python syntax (py_compile)
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.python_cmd }} scripts/dev/run_checks.py --skip-ruff --skip-pytest --python-cmd "${{ matrix.python_cmd }}" 2>&1 | tee -a ci_log.txt
      
      - name: Run fast tests (excluding advanced marker)
        shell: bash
        run: |
          set -o pipefail
          pytest -m "not advanced and not slow" -q --maxfail=3 --tb=short 2>&1 | tee -a ci_log.txt
      
      - name: Run advanced tests (optional, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -m "advanced" -q --maxfail=1 --tb=short 2>&1 | tee -a ci_log.txt || echo "Advanced tests skipped or failed (non-blocking)"
      
      - name: Upload CI log (always)
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ runner.os }}
          path: ci_log.txt
          if-no-files-found: ignore
      
      - name: Upload output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ runner.os }}
          path: output/
          if-no-files-found: ignore

