# GitHub Actions CI Workflow - Evidence Pack (Windows)
#
# Purpose: Windows CI for evidence pack (export/verify/manifest) checks
# Triggers: Push/PR to main and feature/* branches
# Blocking: evidence_pack preset must pass
name: Evidence Pack CI (Windows)

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  windows-evidence-pack:
    name: Evidence Pack Checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-evidence-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-evidence-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pytest ruff pydantic pydantic-settings

      - name: Run evidence_pack preset checks (blocking)
        id: evidence_pack_checks
        run: |
          $output = python scripts/dev/run_checks.py --preset evidence_pack 2>&1
          $exitCode = $LASTEXITCODE
          if ($null -ne $output) { $output | Set-Content -Path run_checks_log.txt -Encoding utf8 } else { "No output captured" | Set-Content -Path run_checks_log.txt -Encoding utf8 }
          Write-Output $output
          exit $exitCode

      - name: Upload evidence_pack logs on failure
        if: always() && steps.evidence_pack_checks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pack-ci-logs
          path: |
            run_checks_log.txt
            output/
          if-no-files-found: ignore

      - name: Run broker_snapshot preset checks (optional)
        continue-on-error: true
        run: |
          python scripts/dev/run_checks.py --preset broker_snapshot || echo "broker_snapshot preset skipped or failed (non-blocking)"

      - name: Run accounting preset checks (optional)
        continue-on-error: true
        run: |
          python scripts/dev/run_checks.py --preset accounting || echo "accounting preset skipped or failed (non-blocking)"
