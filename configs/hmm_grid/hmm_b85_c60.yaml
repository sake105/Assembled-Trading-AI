alerts:
  enabled: true
  output_dir: output/alerts
  rate_limit_seconds: 300
  sinks:
    email:
      enabled: false
      min_severity: CRITICAL
    slack:
      enabled: false
      min_severity: WARNING
anti_churn:
  deadzone_enabled: true
  deadzone_pct: 0.02
  entry_n: 5
  hold_n: 7
  min_notional: 500.0
  ranking_hysteresis_enabled: true
  rebalance_filter_enabled: true
borrow_costs:
  default_rate_bps: 50.0
  enabled: true
  htb_rate_bps: 500.0
correlation_guard:
  max_pairwise_corr: 0.8
  shadow_only: true
cost_aware_wrapper:
  enabled: false
  min_shrink: 0.0
  penalty_factor: null
crash_prediction:
  base_long_gross: 1.0
  equity_cap_enabled: true
  equity_cap_threshold: 0.4
  shadow_only: true
disclosures_confirm:
  boost:
    add_confidence: 0.1
    max_confidence: 0.95
    min_severity: 1
  enabled: true
  qc:
    if_disclosures_degraded: no_boost
drawdown_policy:
  hard: 0.15
  kill: 0.2
  soft: 0.1
edcl_conviction_overlay:
  allow_in_backtest: false
  conviction_threshold: 0.7
  edcl_sizing:
    enabled: false
    max_edcl_weight: 0.3
    model_path: models/conformal_position_v3.joblib
    target_coverage: 0.85
  enabled: false
  max_multiplier: 2.0
  use_historical_beta: true
evidence_engine:
  enabled: true
  grades:
    A:
      description: 'Strong: >=2 Tier-A OR >=3 independent Tier-B, low misinfo risk'
    B:
      description: 'Moderate: >=1 Tier-A OR >=2 independent Tier-B, acceptable misinfo'
    C:
      description: 'Weak: >=1 source but below B threshold'
    D:
      description: 'Insufficient: no qualifying evidence or misinfo too high'
  misinfo_risk_threshold: 0.7
  require_grade_for_active: B
execution:
  cost_meta:
    default_adv: 1000000.0
    default_sigma: 0.02
    enabled: true
    enforce: false
    impact_limit_bps: 50.0
  smart_order_router:
    allow_dark_pools: true
    enabled: true
    max_venues: 3
    urgency: 0.5
execution_policy:
  idempotency_required: true
  mode_default: paper
  reconcile_as_truth: true
fat_finger_guard:
  enabled: true
  max_notional_usd: 500000.0
  max_qty_multiple: 5.0
features:
  behavioral_features:
    cross_sectional_rank: true
    enabled: true
    min_rows: 60
    rank_cols:
    - trend_ema_spread
    - mom_rsi_centered
    - mom_12_1
    - low_vol_rank
    - quality_score
    - trend_strength_20
    - trend_strength_50
    - momentum_12m_excl_1m
    rank_normalize_to: symmetric
    ta_factors_core: true
  enhanced_factors:
    enabled: true
  macro_growth_regime: true
  macro_inflation_regime: true
  macro_risk_aversion: true
  news_count_30d: true
  news_count_7d: true
  news_features:
    enabled: false
    long_window: 30
    short_window: 7
  news_sentiment_30d: true
  news_sentiment_7d: true
  news_sentiment_shock: true
  news_sentiment_z: true
  news_volume_spike: true
freshness_monitor:
  enabled: true
  stale_feature_days: 5
georisk_overlay:
  by_geo_score:
    '0': 1.0
    '1': 0.9
    '2': 0.7
    '3': 0.5
  confidence_floor: 0.6
  enabled: true
  mapping:
    ACTIVE:
      hedge:
        enabled: false
      multiplier: 0.7
    COOLDOWN:
      hedge:
        enabled: false
      multiplier: 0.85
    PAUSE:
      hedge:
        enabled: false
      multiplier: 0.0
    WATCH:
      hedge:
        enabled: false
      multiplier: 1.0
  max_geo_multiplier: 2.0
  qc:
    if_intel_degraded: WATCH
  source: news_geo
health_gates:
  disclosures:
    degraded_behavior: WATCH_ONLY
  marketdata:
    degraded_behavior: PAUSE
  news:
    degraded_behavior: WATCH_ONLY
    required_tier_for_active: A
hmm_regime_overlay:
  enabled: true
  model_path: models/regime_hmm_4state_spy.joblib
  multipliers:
    bear: 0.85
    bull: 1.0
    crisis: 0.6
    sideways: 1.0
intel:
  crisis_alpha:
    enabled: true
    shadow_only: true
  disclosures_triggers:
    enabled: false
    path: output/intel/disclosures/triggers_latest.json
  kill_switch:
    enabled: false
  news_signal_bridge:
    allow_short: false
    enabled: true
    min_severity: 1
    weight: 0.1
  nlp:
    enabled: false
  rss:
    enabled: true
  signal_layer:
    allow_short: false
    enabled: true
    min_confidence: 0.5
    shock_confidence: 0.6
    weight: 0.15
inverse_etf:
  crash_prob_threshold: 0.4
  enabled: true
  hedge_ratio: 0.1
  max_holding_days: 5
  shadow_only: true
  vix_threshold: 25.0
kpi_export:
  enabled: true
  gateway_url: null
  output_dir: output/metrics
logging_policy:
  artifact_paths:
    policy_snapshot: output/policy/policy_snapshot.yaml
  audit_required: true
market_stress:
  confirm_rule:
    mode: any
  enabled: true
  exposure_scaling:
    stress_score_1: 0.75
    stress_score_2: 0.5
  lookback_days: 20
  metrics:
    dd_lookback:
      dd_threshold: -0.05
      enabled: true
    vol_z:
      enabled: true
      z_threshold: 1.5
  qc:
    if_data_missing: false
ml:
  drift_detection:
    enabled: true
    p_value_threshold: 0.01
monte_carlo:
  auto_run: false
  confidence_level: 0.95
  n_paths: 500
  seed: null
multifactor_signal:
  bundle_path: configs/factor_bundles/macro_world_etfs_core_bundle.yaml
  enabled: true
paper_trading:
  enable_fat_finger: true
  enable_ledger: true
  enable_reconciliation: true
  engine: unified
  seed_capital: 100000.0
policy_version: v1.0
position_sizing:
  black_litterman:
    max_weight: 0.15
    min_history_days: 60
    risk_aversion: 2.5
    tau: 0.05
  conformal:
    enabled: false
    model_path: models/conformal_position_v3.joblib
  fallback_method: vol_scaled
  kelly_uncertainty_shadow:
    enabled: true
    fractional_kelly: 0.5
    max_fraction: 0.25
    normalize: true
    reference_half_width: null
    vol_lookback_days: 60
  method: black_litterman
profit_lock:
  cooldown_days: 10
  enabled: true
  floor: 0.5
  lookback_days: 20
  multiplier_on_trigger: 0.8
  trigger_return: 0.08
regime_detection:
  benchmark_symbol: SPY
  enabled: true
  method: hmm
  min_history_days: 120
  multifeature: false
  n_regimes: 3
regime_walk_forward:
  enabled: false
risk_limits:
  concentration_guard:
    max_corr_cluster_weight: 0.5
    max_sector_weight: 0.4
  max_drawdown:
    hard: 0.2
    kill: 0.3
    soft: 0.12
  max_gross_exposure: 1.0
  max_position_weight: 0.2
  target_vol_annual: 0.2
  turnover:
    daily_cap: 0.2
    weekly_cap: 0.5
risk_state_machine:
  cooldown:
    hours: 24
  enabled: true
  hysteresis:
    activate_score: 2
    confidence_floor: 0.6
    deactivate_score: 1
    disclosures_confirm_gate:
      enabled: true
      min_geo_score: 3
      on_states:
      - WATCH
      - COOLDOWN
    disclosures_min_severity: 1
    pause_score: 3
    require_disclosures_confirm: false
    require_market_stress_confirm: true
  pause:
    enabled: false
    hours: 12
    require_confidence: 0.8
  persistence:
    lock:
      backoff_ms: 50
      enabled: true
      retries: 5
    mode: live
    per_run_dir: output/state/runs
  qc:
    if_intel_degraded: WATCH
  state_path: output/state/risk_state.json
robustness:
  deterministic: true
  enabled: false
scope:
  instruments:
  - ETFs
  - equities
  leverage_allowed: false
  shorts_allowed: true
shorts:
  allowed_instruments:
    direct_short: true
    inverse_etf_1x: true
    inverse_etf_2x: false
    inverse_etf_3x: false
  borrow_cost_assumption_bps: 50
  enabled: true
  max_gross_exposure: 1.5
  max_net_short: 0.2
  max_short_weight_per_position: 0.1
  max_stop_loss_pct: 0.15
  max_total_short_exposure: 0.3
  min_crash_probability: 0.6
  min_short_signal_confidence: 0.7
  regime_scaling:
    bear: 0.25
    bull: 0.0
    crisis: 0.3
    reflation: 0.05
    sideways: 0.1
  require_stop_loss: true
  squeeze_risk_check: true
signal_decay:
  enabled: false
  shadow_only: true
  stale_multiplier: 0.0
signal_generation:
  bayesian_confidence:
    ci_level: 0.9
    enabled: true
    max_scale: 1.5
    min_scale: 0.5
  earnings_guard:
    enabled: true
    pead_weight: 0.15
    pead_window_days: 60
    suppress_window: 3
  ml_enhanced:
    confidence_threshold: 0.55
    meta_model_path: models/meta/meta_model_latest.joblib
    scale_by_confidence: true
    use_quantile_sizing: false
    use_stacking: true
  mode: multifactor
  multifactor:
    bottom_n: 5
    regime_blending: true
    score_method: adaptive
    sector_neutralize: false
    top_n: 15
  sector_rotation:
    enabled: true
    long_weight: 0.12
    short_weight: 0.08
  signal_diagnostics:
    enabled: true
    forward_returns_col: return_1d
    ic_alert_threshold: 0.0
    output_dir: output/diagnostics
signals:
  meta_model:
    confidence_threshold: 0.58
    enabled: false
    model_path: models/meta_model_lgbm_v2.joblib
    scale_by_confidence: true
  meta_model_scoring:
    enabled: false
    model_path: output/models/meta/meta_model.joblib
state_machine:
  activation:
    evidence_tiers:
    - A
    - B
    requires_geo_trigger: true
    requires_market_stress_confirm: true
  deactivation:
    cooldown_days: 5
    geo_decay_days: 14
    vol_normalization_days: 20
  states:
  - WATCH
  - ACTIVE
  - COOLDOWN
  - PAUSE
turnover_budget:
  behavior: scale
  cap: 0.5
  enabled: true
  min_trade_notional: 0
  mode: daily
  qc:
    if_missing_prices: scale_to_zero
vol_targeting:
  enabled: false
  lookback_days: 20
  max_scale: 1.0
  min_scale: 0.5
  target_vol_annual: 0.15
zombie_killer:
  max_hold_days: 30
  shadow_only: true
  stale_signal_bars: 10
