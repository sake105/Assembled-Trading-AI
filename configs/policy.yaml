policy_version: "v1.0"

# High-level scope for this policy version.
scope:
  instruments: ["ETFs", "equities"]  # ETFs + direct equities for short candidates
  leverage_allowed: false            # no leverage / no leveraged products
  shorts_allowed: true               # v2.0: enabled — inverse ETFs + direct shorts

# Short-selling configuration (active when shorts_allowed: true)
shorts:
  enabled: true
  max_short_weight_per_position: 0.10   # max 10% per short position
  max_total_short_exposure: 0.30        # max 30% total short exposure
  # Historical shorts-specific cap (long + |short|). Kept for documentation of
  # the intended headroom *if* leverage were enabled. Currently overridden by
  # `risk_limits.max_gross_exposure: 1.0` via `min()` in trading_cycle.py
  # because scope.leverage_allowed=false. Changing this alone will NOT loosen
  # the effective cap — you must also raise risk_limits.max_gross_exposure AND
  # flip leverage_allowed=true (P0 finding A6, Deep Run v2, 2026-04-18).
  max_gross_exposure: 1.50              # long + |short| <= 150%
  max_net_short: 0.20                   # max 20% net short
  allowed_instruments:
    direct_short: true                  # direct equity shorts
    inverse_etf_1x: true               # 1x inverse ETFs (SH, PSQ, RWM, etc.)
    inverse_etf_2x: false              # 2x inverse ETFs disabled (volatility decay)
    inverse_etf_3x: false              # 3x inverse ETFs never
  regime_scaling:
    bull: 0.0                           # no shorts in bull market
    sideways: 0.10                      # max 10% short
    bear: 0.25                          # max 25% short
    crisis: 0.30                        # max 30% short — fully active
    reflation: 0.05                     # minimal
  borrow_cost_assumption_bps: 50        # 50bps p.a. borrow cost assumption
  squeeze_risk_check: true              # enable short-squeeze detection
  min_short_signal_confidence: 0.70     # higher confidence threshold for shorts
  min_crash_probability: 0.60          # min crash probability to activate shorts
  require_stop_loss: true               # every short MUST have a stop-loss
  max_stop_loss_pct: 0.15              # max 15% loss before stop-out

# Risk limits are benchmark-style constraints, not auto-stops on returns.
risk_limits:
  target_vol_annual: 0.20         # 20% annualized vol target; moderate for ETF portfolio
  max_drawdown:
    soft: 0.12                   # 12% DD triggers de-risk scaling
    hard: 0.20                   # 20% DD hard position reduction
    kill: 0.30                   # 30% DD triggers kill switch
  max_position_weight: 0.20      # max 20% in any single ETF
  # Gross-exposure cap (long + |short|) for general pre-trade gate. P0 finding A6
  # (Deep Run v2, 2026-04-18): prior to this key, the only gross cap was under
  # `shorts.max_gross_exposure` (1.50), which is shorts-specific. This key is
  # read first by pipeline/trading_cycle.py and must be consistent with
  # scope.leverage_allowed=false (see policy_schema.py gross-exposure check).
  max_gross_exposure: 1.0        # leverage_allowed: false → cap at 100%
  turnover:
    weekly_cap: 0.50             # max 50% portfolio turnover per week
    daily_cap: 0.20              # max 20% portfolio turnover per day
  concentration_guard:
    max_sector_weight: 0.40      # max 40% in correlated sector ETFs
    max_corr_cluster_weight: 0.50 # max 50% in highly correlated cluster

# High-level state machine config (WATCH / ACTIVE / COOLDOWN / PAUSE).
state_machine:
  states: ["WATCH", "ACTIVE", "COOLDOWN", "PAUSE"]
  activation:
    requires_geo_trigger: true
    requires_market_stress_confirm: true
    evidence_tiers: ["A", "B"]   # welche Evidenz-Ebenen für ACTIVE nötig sind
  deactivation:
    geo_decay_days: 14            # geo risk decays over 14 days
    vol_normalization_days: 20   # vol normalization window: 20 days
    cooldown_days: 5             # minimum 5 days in COOLDOWN state

# Health / QC gates for external inputs (News, Disclosures, Market Data).
health_gates:
  news:
    degraded_behavior: "WATCH_ONLY"   # oder "PAUSE" für strengere Policy
    required_tier_for_active: "A"
  disclosures:
    degraded_behavior: "WATCH_ONLY"
  marketdata:
    degraded_behavior: "PAUSE"

# Intel integrations (read-only load into TradingContext).
intel:
  disclosures_triggers:
    enabled: false
    path: "output/intel/disclosures/triggers_latest.json"

  # Phase 9: Intel alpha signal layer wired into signal pipeline
  signal_layer:
    enabled: false           # enable compute_symbol_intel_scores() in trading_cycle
    weight: 0.15             # additive weight of intel score on signal score
    allow_short: false       # allow short signals from intel losers
    min_confidence: 0.50     # minimum intel signal confidence
    shock_confidence: 0.60   # base confidence for shock beneficiary signals

# Disclosures confirmation boost for NEWS geo_confidence (DISCL-4.2).
disclosures_confirm:
  enabled: true
  boost:
    min_severity: 1
    add_confidence: 0.10
    max_confidence: 0.95
  qc:
    if_disclosures_degraded: "no_boost"

# Execution & operations policy (high-level, environment-agnostic).
execution_policy:
  mode_default: "paper"          # v1.x: Paper-Track als Default; Live kommt später
  idempotency_required: true     # kritische Worker müssen idempotent sein
  reconcile_as_truth: true       # Reconcile-Ergebnis gilt als „source of truth“ für Zustand

# Logging / audit requirements for policy-relevant actions.
logging_policy:
  audit_required: true
  artifact_paths:
    policy_snapshot: "output/policy/policy_snapshot.yaml"  # Snapshot des aktiven Policy-Configs pro Run

georisk_overlay:
  enabled: true
  source: "news_geo"
  mapping:
    WATCH:
      multiplier: 1.00
      hedge:
        enabled: false
    ACTIVE:
      multiplier: 0.70
      hedge:
        enabled: false
    COOLDOWN:
      multiplier: 0.85
      hedge:
        enabled: false
    PAUSE:
      multiplier: 0.00
      hedge:
        enabled: false
  by_geo_score:
    "0": 1.00
    "1": 0.90
    "2": 0.70
    "3": 0.50
  confidence_floor: 0.60
  qc:
    if_intel_degraded: "WATCH"

turnover_budget:
  enabled: true
  mode: "daily"
  cap: 0.50
  min_trade_notional: 0
  behavior: "scale"
  qc:
    if_missing_prices: "scale_to_zero"

profit_lock:
  enabled: true
  lookback_days: 20
  trigger_return: 0.08
  multiplier_on_trigger: 0.80
  floor: 0.50
  cooldown_days: 10

vol_targeting:
  enabled: false              # M6-T03: disabled by default; enable with calibrated target_vol_annual
  lookback_days: 20
  target_vol_annual: 0.15     # 15% annualized target; tune before enabling
  min_scale: 0.50             # floor: never reduce below 50% exposure
  max_scale: 1.00             # no amplification; consistent with leverage_allowed: false

market_stress:
  enabled: true
  lookback_days: 20
  metrics:
    vol_z:
      enabled: true
      z_threshold: 1.5
    dd_lookback:
      enabled: true
      dd_threshold: -0.05
  confirm_rule:
    mode: "any"
  qc:
    if_data_missing: false
  exposure_scaling:
    stress_score_1: 0.75          # moderate stress (1 trigger) -> 75% exposure
    stress_score_2: 0.50          # high stress (2 triggers) -> 50% exposure

risk_state_machine:
  enabled: true
  state_path: "output/state/risk_state.json"
  persistence:
    mode: "live"
    per_run_dir: "output/state/runs"
    lock:
      enabled: true
      retries: 5
      backoff_ms: 50
  hysteresis:
    activate_score: 2
    deactivate_score: 1
    pause_score: 3
    confidence_floor: 0.60
    require_market_stress_confirm: true
    require_disclosures_confirm: false
    disclosures_min_severity: 1
    disclosures_confirm_gate:
      enabled: true
      min_geo_score: 3
      on_states: ["WATCH", "COOLDOWN"]
  cooldown:
    hours: 24
  pause:
    enabled: false
    require_confidence: 0.80
    hours: 12
  qc:
    if_intel_degraded: "WATCH"


# ---------------------------------------------------------------------------
# Regime detection (Phase 0D)
# ---------------------------------------------------------------------------
regime_detection:
  enabled: true
  method: "hmm"              # "hmm" | "multifeature_hmm" | "rule_based"
  n_regimes: 3               # bull / bear / sideways
  benchmark_symbol: "SPY"
  multifeature: false        # true → MultiFeatureRegimeHMM (4 observables)
  min_history_days: 120      # minimum trading days before HMM fit

# ---------------------------------------------------------------------------
# Signal generation mode (Phase 0.1)
# ---------------------------------------------------------------------------
signal_generation:
  mode: "multifactor"        # "ema" | "multifactor" | "ml_enhanced"
  multifactor:
    top_n: 15                # long candidates
    bottom_n: 5              # short candidates (if shorts_allowed)
    score_method: "adaptive" # "static" | "adaptive" (IC-weighted)
    regime_blending: true    # use regime-conditional weights
    sector_neutralize: false # sector-bias elimination (Phase 9)
  ml_enhanced:
    meta_model_path: "models/meta/meta_model_latest.joblib"
    confidence_threshold: 0.55
    scale_by_confidence: true
    use_stacking: true
    use_quantile_sizing: false

# ---------------------------------------------------------------------------
# Position sizing (Phase 0C)
# ---------------------------------------------------------------------------
position_sizing:
  method: "black_litterman"    # "equal_weight" | "score_weighted" | "vol_scaled" | "black_litterman" | "cost_aware"
  black_litterman:
    risk_aversion: 2.5
    tau: 0.05
    max_weight: 0.15
    min_history_days: 60       # fallback to vol_scaled if insufficient data
  fallback_method: "vol_scaled"  # used when BL fails to converge

# ---------------------------------------------------------------------------
# Anti-churn / hysteresis (Phase 0D)
# ---------------------------------------------------------------------------
anti_churn:
  ranking_hysteresis_enabled: true
  entry_n: 5                   # new positions need top-5 rank
  hold_n: 7                    # existing positions stay if top-7
  deadzone_enabled: true
  deadzone_pct: 0.02           # rebalance only if weight diff > 2%

  # Phase 9: Sector rotation overlay (gate: signal_generation.sector_rotation.enabled)
  sector_rotation:
    enabled: false           # enable to wire generate_sector_rotation_signals() as additional source
    long_weight: 0.12        # per-sector long ETF weight
    short_weight: 0.08       # per-sector short ETF weight (absolute)

  # Phase 9: Pre-earnings signal suppression + PEAD (gate: signal_generation.earnings_guard.enabled)
  earnings_guard:
    enabled: false           # enable to suppress signals 3d before earnings + PEAD drift
    suppress_window: 3       # days before earnings to zero out mean-reversion signals
    pead_window_days: 60     # PEAD drift window (days after earnings)
    pead_weight: 0.15        # weight added to score from PEAD signal

  # Phase 9: Bayesian signal confidence scoring (gate: signal_generation.bayesian_confidence.enabled)
  bayesian_confidence:
    enabled: false           # enable Bayesian CI scoring for position scaling
    ci_level: 0.90           # credible interval level (90%)
    max_scale: 1.50          # maximum position scale factor from confidence
    min_scale: 0.50          # minimum position scale factor from confidence

  # Phase 9: Signal health diagnostics at end of each cycle
  signal_diagnostics:
    enabled: false           # enable compute_signal_health() + JSON artifact
    forward_returns_col: "return_1d"
    ic_alert_threshold: 0.0  # rolling IC below this triggers WARNING
    output_dir: "output/diagnostics"

evidence_engine:
  enabled: true
  require_grade_for_active: "B"   # minimum evidence grade to allow WATCH->ACTIVE
  misinfo_risk_threshold: 0.70    # misinfo score above this blocks grade A
  grades:
    A:
      description: "Strong: >=2 Tier-A OR >=3 independent Tier-B, low misinfo risk"
    B:
      description: "Moderate: >=1 Tier-A OR >=2 independent Tier-B, acceptable misinfo"
    C:
      description: "Weak: >=1 source but below B threshold"
    D:
      description: "Insufficient: no qualifying evidence or misinfo too high"

# ---------------------------------------------------------------------------
# Paper trading engine selection
# ---------------------------------------------------------------------------
paper_trading:
  engine: "unified"              # "unified" uses UnifiedPaperEngine; other values fall back to legacy PaperTrackRunner
  seed_capital: 100000.0
  enable_ledger: true
  enable_reconciliation: true
  enable_fat_finger: true

# ---------------------------------------------------------------------------
# Phase 10: Monte Carlo robustness (bootstrap after each cycle / backtest)
# ---------------------------------------------------------------------------
monte_carlo:
  auto_run: false            # if true: bootstrap_returns() runs after each trading cycle
  n_paths: 500               # bootstrap paths (500 = fast; use 1000+ for reports)
  confidence_level: 0.95     # CI level
  seed: null                 # null = random; set integer for reproducibility

# Phase 10: Parameter robustness (optional, heavier — intended for batch runs)
robustness:
  enabled: false             # gate: enable run_param_grid_sweep() on batch backtest
  deterministic: true

# Phase 10: Regime-aware walk-forward validation
regime_walk_forward:
  enabled: false             # gate: enable regime-aware WF as validation step

# ---------------------------------------------------------------------------
# Phase 11: Alert system
# ---------------------------------------------------------------------------
alerts:
  enabled: true              # enable alert_health_worker in daily_scheduler
  rate_limit_seconds: 300    # seconds between identical alert messages
  output_dir: "output/alerts"
  sinks:
    slack:
      enabled: false         # enable SlackWebhookSink (set ASSEMBLED_SLACK_WEBHOOK_URL env var)
      min_severity: "WARNING"
    email:
      enabled: false         # enable EmailSink (set ASSEMBLED_SMTP_* env vars)
      min_severity: "CRITICAL"

# Phase 11: KPI / Prometheus metrics export
kpi_export:
  enabled: true              # enable metrics_exporter + kpi_export_worker
  output_dir: "output/metrics"
  gateway_url: null          # set to Prometheus Pushgateway URL if desired

# ---------------------------------------------------------------------------
# Ultra-Plan Part D — shadow-mode gates for activation observation.
# All default shadow_only=true. Flip to false only after 5 trading-day
# observation window documented in output/activation_ledger.md.
# ---------------------------------------------------------------------------
correlation_guard:
  shadow_only: true          # D1 — compute but do not apply scaled weights
  max_pairwise_corr: 0.8
zombie_killer:
  shadow_only: true          # D2 — log zombies but do not force-flat
  max_hold_days: 30
  stale_signal_bars: 10
crash_prediction:
  shadow_only: true          # D3 — long-gross equity cap shadow-only
  equity_cap_enabled: true
  equity_cap_threshold: 0.4
  base_long_gross: 1.0
inverse_etf:
  shadow_only: true          # D4 — hedge recommendation only
  enabled: true              # activate gate evaluation (recording still shadow)
  vix_threshold: 25.0
  crash_prob_threshold: 0.4
  hedge_ratio: 0.1
  max_holding_days: 5
signal_decay:
  shadow_only: true          # D5 — apply multipliers only when false
  enabled: false
  stale_multiplier: 0.0
