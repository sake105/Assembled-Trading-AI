policy_version: "v1.0"

# High-level scope for this policy version.
scope:
  instruments: ["ETFs", "equities"]  # ETFs + direct equities for short candidates
  leverage_allowed: true             # Wave 4: limited leverage up to 1.20x gross exposure (paper-trading only)
  shorts_allowed: true               # v2.0: enabled — inverse ETFs + direct shorts

# Short-selling configuration (active when shorts_allowed: true)
shorts:
  enabled: true
  max_short_weight_per_position: 0.10   # max 10% per short position
  max_total_short_exposure: 0.50        # raised 2026-05-24: 50% in crisis-active mode
  # Historical shorts-specific cap (long + |short|). Kept for documentation of
  # the intended headroom *if* leverage were enabled. Currently overridden by
  # `risk_limits.max_gross_exposure: 1.0` via `min()` in trading_cycle.py
  # because scope.leverage_allowed=false. Changing this alone will NOT loosen
  # the effective cap — you must also raise risk_limits.max_gross_exposure AND
  # flip leverage_allowed=true (P0 finding A6, Deep Run v2, 2026-04-18).
  max_gross_exposure: 1.50              # long + |short| <= 150%
  max_net_short: 0.20                   # max 20% net short
  allowed_instruments:
    direct_short: true                  # direct equity shorts
    inverse_etf_1x: true               # 1x inverse ETFs (SH, PSQ, RWM, etc.)
    inverse_etf_2x: false              # 2x inverse ETFs disabled (volatility decay)
    inverse_etf_3x: false              # 3x inverse ETFs never
  regime_scaling:
    bull: 0.0                           # no shorts in bull market
    sideways: 0.10                      # max 10% short
    bear: 0.25                          # max 25% short
    crisis: 0.50                        # raised 2026-05-24: 50% short — crisis-active
    reflation: 0.05                     # minimal
  borrow_cost_assumption_bps: 50        # 50bps p.a. borrow cost assumption
  squeeze_risk_check: true              # enable short-squeeze detection
  min_short_signal_confidence: 0.70     # higher confidence threshold for shorts
  min_crash_probability: 0.60          # min crash probability to activate shorts
  require_stop_loss: true               # every short MUST have a stop-loss
  max_stop_loss_pct: 0.15              # max 15% loss before stop-out

# Risk limits are benchmark-style constraints, not auto-stops on returns.
risk_limits:
  target_vol_annual: 0.20         # 20% annualized vol target; moderate for ETF portfolio
  max_drawdown:
    soft: 0.12                   # 12% DD triggers de-risk scaling
    hard: 0.20                   # 20% DD hard position reduction
    kill: 0.30                   # 30% DD triggers kill switch
  max_position_weight: 0.20      # max 20% in any single ETF
  # Gross-exposure cap (long + |short|) for general pre-trade gate. P0 finding A6
  # (Deep Run v2, 2026-04-18): prior to this key, the only gross cap was under
  # `shorts.max_gross_exposure` (1.50), which is shorts-specific. This key is
  # read first by pipeline/trading_cycle.py and must be consistent with
  # scope.leverage_allowed=false (see policy_schema.py gross-exposure check).
  max_gross_exposure: 1.20       # Wave 4: 20% leverage headroom; enforced at pre-trade gate
  turnover:
    weekly_cap: 0.50             # max 50% portfolio turnover per week
    daily_cap: 0.20              # max 20% portfolio turnover per day
  concentration_guard:
    max_sector_weight: 0.40      # max 40% in correlated sector ETFs
    max_corr_cluster_weight: 0.50 # max 50% in highly correlated cluster
  # Item 69: Buying-power utilization limit.
  # When ctx.buying_power is explicitly set (live broker value), positions are scaled
  # down if gross_weight > this fraction. Set buying_power_from_capital=true to
  # activate the check even without an explicit broker buying_power attribute (uses
  # ctx.capital as proxy — useful for paper trading with capital enforcement).
  buying_power_utilization_limit: 0.95
  buying_power_from_capital: false  # false = only activate when broker sets buying_power

# Auto-DD kill-switch thresholds read by trading_cycle_shared.py.
# More conservative than risk_limits.max_drawdown (benchmark-style) to trigger
# intra-run de-risk/kill earlier. Values must be <= corresponding risk_limits entries.
drawdown_policy:
  soft: 0.10   # warn at 10% DD
  hard: 0.15   # reduce exposure at 15% DD
  kill: 0.20   # kill switch at 20% DD

# High-level state machine config (WATCH / ACTIVE / COOLDOWN / PAUSE).
state_machine:
  states: ["WATCH", "ACTIVE", "COOLDOWN", "PAUSE"]
  activation:
    requires_geo_trigger: true
    requires_market_stress_confirm: true
    evidence_tiers: ["A", "B"]   # welche Evidenz-Ebenen für ACTIVE nötig sind
  deactivation:
    geo_decay_days: 14            # geo risk decays over 14 days
    vol_normalization_days: 20   # vol normalization window: 20 days
    cooldown_days: 5             # minimum 5 days in COOLDOWN state

# Health / QC gates for external inputs (News, Disclosures, Market Data).
health_gates:
  news:
    degraded_behavior: "WATCH_ONLY"   # oder "PAUSE" für strengere Policy
    required_tier_for_active: "A"
  disclosures:
    degraded_behavior: "WATCH_ONLY"
  marketdata:
    degraded_behavior: "PAUSE"

# Intel integrations (read-only load into TradingContext).
intel:
  disclosures_triggers:
    enabled: false
    path: "output/intel/disclosures/triggers_latest.json"

  # RSS feed integration — 71+ feeds wired via rss_fetcher.py
  rss:
    enabled: true  # Wire RSSFetcher into intel cycle (parallel with GDELT)

  # NLP sentiment scoring via FinBERT (optional, requires transformers)
  nlp:
    enabled: false  # set true to activate FinBERT sentiment on RSS events

  # T4.7: Master kill-switch — stops News + GDELT + Disclosures pipelines.
  # Workers read this flag at startup and exit-early when enabled.
  kill_switch:
    enabled: false           # set true to halt all intel/news/disclosures workers

  # T4.1: Crisis-Alpha v1 integration — live mode (shadow_only flipped 2026-05-24)
  crisis_alpha:
    enabled: true            # wire run_crisis_alpha_pipeline() into trading_cycle
    shadow_only: false       # false = crisis entries and caps actually affect orders
    basket_regime_detection:
      enabled: true          # switch basket based on rate regime (TLT vs SHY momentum)
      lookback_days: 90      # rolling window for TLT/SHY relative performance
      rate_hike_threshold: -0.05  # TLT-SHY gap below this => rate_hike basket (XLE/XLU/GLD/SHY)

  # Phase 9: Intel alpha signal layer wired into signal pipeline
  signal_layer:
    enabled: true            # enable compute_symbol_intel_scores() in trading_cycle
    weight: 0.15             # additive weight of intel score on signal score
    allow_short: false       # allow short signals from intel losers (inverse-ETF blacklist enforced in intel_signal_adapter.py)
    min_confidence: 0.50     # minimum intel signal confidence
    shock_confidence: 0.60   # base confidence for shock beneficiary signals

  # Part B deeper wiring (2026-04-22): News→Signal bridge. Reads
  # output/intel/news/triggers_latest.json and applies per-ticker score deltas
  # based on severity * urgency * sentiment_sign. allow_short=false keeps the
  # bridge long-only (matches signal_layer + sector_rotation defaults).
  news_signal_bridge:
    enabled: true
    weight: 0.10             # max scaled score delta contribution per ticker
    min_severity: 1          # 1 = WATCH, 2+ = ACTIVE
    allow_short: false

# T4.2: News Alpha — event-driven directional trading (fast, intraday-capable).
# Separate from crisis_alpha (slow defensive overlay). This is the directional
# alpha layer: Hormuz → XLE long within hours, Hamas → LMT long, etc.
#
# shadow_only: true  = signals generated + logged but NOT applied to target_positions
# shadow_only: false = signals applied (flip after paper-trading validation)
#
# Run intraday runner: python scripts/run_news_alpha_intraday.py
# Backtest (EOD vs open): python scripts/backtest_news_alpha_intraday.py
news_alpha:
  enabled: true
  shadow_only: false         # T5: paper validation active — flipped 2026-05-26
  base_weight: 0.08          # base weight per signal (scaled by severity)
  leverage_etfs_allowed: false  # disallow UCO/TBT until paper validation passes
  # Sub-portfolio cap consumed by signals_to_weights() inside the pipeline.
  # Global combined-portfolio cap is at risk_limits.max_gross_exposure (below).
  # Editing this value changes the news_alpha slice cap, NOT the global cap.
  max_gross_exposure: 0.40

# Disclosures confirmation boost for NEWS geo_confidence (DISCL-4.2).
disclosures_confirm:
  enabled: true
  boost:
    min_severity: 1
    add_confidence: 0.10
    max_confidence: 0.95
  qc:
    if_disclosures_degraded: "no_boost"

# Execution & operations policy (high-level, environment-agnostic).
execution_policy:
  mode_default: "paper"          # v1.x: Paper-Track als Default; Live kommt später
  idempotency_required: true     # kritische Worker müssen idempotent sein
  reconcile_as_truth: true       # Reconcile-Ergebnis gilt als „source of truth" für Zustand
  # Item 56: Extended-hours policy — skip avoids wide pre/post-market spreads (5-10x normal).
  # Options: "skip" (default, safest for pilot), "use" (extended hours allowed), "adaptive" (future).
  # "use" requires additional liquidity check before submit (spread guard not yet implemented).
  extended_hours_policy: "skip"  # Pre- and post-market orders are discarded, not resubmitted.

  # ---------------------------------------------------------------------------
  # Item 105: enforce_market_hours — global default + per-strategy overrides.
  #
  # The global setting (enforce_market_hours: true) is the safety default. It is
  # read by execution/broker_adapter.py (AlpacaAdapter constructor) and rejects
  # orders submitted outside NYSE regular session (09:30–16:00 ET).
  #
  # Per-strategy overrides live under execution_policy.strategy_overrides.<name>.
  # They are NOT currently read by broker_adapter.py or any pipeline code —
  # the override pattern is documented here so callers can implement it:
  #
  #   policy = yaml.safe_load(open("configs/policy.yaml"))
  #   ep = policy.get("execution_policy", {})
  #   global_emh = ep.get("enforce_market_hours", True)
  #   strategy_emh = (
  #       ep.get("strategy_overrides", {})
  #         .get(strategy_name, {})
  #         .get("enforce_market_hours", global_emh)
  #   )
  #   adapter = AlpacaAdapter(enforce_market_hours=strategy_emh)
  #
  # Rule: global must remain true; set a per-strategy override to false only for
  # strategies that explicitly handle extended-hours liquidity risk themselves
  # (e.g. an event-driven strategy that must act on earnings releases after close).
  # ---------------------------------------------------------------------------
  enforce_market_hours: true          # global default — always true for pilot

  # Per-strategy overrides (all unset = inherit global default = true).
  # Only add a strategy here if you have a specific, documented reason to
  # deviate from the global default.
  strategy_overrides:
    # Example — uncomment and adjust if a strategy needs extended-hours access:
    # event_driven_v1:
    #   enforce_market_hours: false   # reason: acts on after-hours earnings prints
    #                                 # risk: wider spreads; requires spread_guard (not yet implemented)

# Part B deeper wiring (2026-04-22): pre-trade execution cost layer.
# Activated via paper_runner → annotate_execution_cost, which writes per-order
# Almgren-Chriss impact estimates + SOR venue allocation into result.meta.
# enforce=false means high-impact orders are flagged but NOT dropped (shadow).
execution:
  algo_execution:
    enabled: true
    algo: "TWAP"
    n_slices: 10
    participation_rate: 0.10
  cost_meta:
    enabled: true            # annotate result.meta.execution_cost with per-order estimates
    impact_limit_bps: 50.0   # orders beyond this are tagged high_impact=true
    enforce: false           # when true, high-impact orders are filtered out pre-fill
    default_adv: 1000000.0   # ADV fallback when volume data unavailable
    default_sigma: 0.02      # daily vol fallback for Almgren-Chriss
  smart_order_router:
    enabled: true            # compute venue allocation for each order
    urgency: 0.5             # 0=patient, 1=urgent
    allow_dark_pools: true
    max_venues: 3

# Logging / audit requirements for policy-relevant actions.
logging_policy:
  audit_required: true
  artifact_paths:
    policy_snapshot: "output/policy/policy_snapshot.yaml"  # Snapshot des aktiven Policy-Configs pro Run

georisk_overlay:
  enabled: true
  source: "news_geo"
  max_geo_multiplier: 2.0         # Phase A: raised from 1.0 to allow upscaling; mapping values still <= 1.0
  mapping:
    WATCH:
      multiplier: 1.00
      hedge:
        enabled: false
    ACTIVE:
      multiplier: 0.70
      hedge:
        enabled: false
    COOLDOWN:
      multiplier: 0.85
      hedge:
        enabled: false
    PAUSE:
      multiplier: 0.00
      hedge:
        enabled: false
  by_geo_score:
    "0": 1.00
    "1": 0.90
    "2": 0.70
    "3": 0.50
  confidence_floor: 0.60
  qc:
    if_intel_degraded: "WATCH"

turnover_budget:
  enabled: true
  mode: "daily"
  cap: 0.50
  min_trade_notional: 0
  behavior: "scale"
  qc:
    if_missing_prices: "scale_to_zero"

# Dead-Man's Switch — passive heartbeat monitor.
# If the trading cycle fails to write a heartbeat within timeout_seconds,
# the DMS daemon auto-flattens all positions via the kill switch.
# See src/assembled_core/ops/dead_man_switch.py and scripts/dms_daemon.py.
dead_man_switch:
  enabled: true
  timeout_seconds: 900          # 15 min — flatten if no heartbeat for this long
  check_interval_seconds: 60    # poll every 60s
  flatten_mode: "market"        # "market" = activate kill switch; "shadow" = log only
  log_path: "output/ops/dms_audit.jsonl"

profit_lock:
  enabled: true
  lookback_days: 20
  trigger_return: 0.08
  multiplier_on_trigger: 0.80
  floor: 0.50
  cooldown_days: 10

vol_targeting:
  enabled: false              # M6-T03: disabled by default; enable with calibrated target_vol_annual
  lookback_days: 20
  target_vol_annual: 0.15     # 15% annualized target; tune before enabling
  min_scale: 0.50             # floor: never reduce below 50% exposure
  max_scale: 1.00             # no amplification; consistent with leverage_allowed: false

# ---------------------------------------------------------------------------
# Macro Event Calendar (Item 82) — FOMC/CPI/NFP exposure reduction.
# On scheduled macro event days (FOMC decision, CPI release, NFP), reduce
# overall exposure to avoid gap risk from surprise prints.
# Source: news_macro_calendar.py (fomc, cpi, nfp, ppi event types).
# ---------------------------------------------------------------------------
macro_event_calendar:
  enabled: true
  fomc:
    exposure_scale: 0.50          # Reduce to 50% exposure 60min before/120min after decision
    window_before_min: 60         # minutes before event to reduce exposure
    window_after_min: 120         # minutes after event to restore exposure
  cpi:
    exposure_scale: 0.70          # Less aggressive reduction for CPI
    window_before_min: 30
    window_after_min: 60
  nfp:
    exposure_scale: 0.70          # NFP (Non-Farm Payrolls) first Friday of month
    window_before_min: 30
    window_after_min: 60

# ---------------------------------------------------------------------------
# M&A Exclusion (Item 85) — Remove symbols with active M&A events from trading.
# Symbols set via ctx.ma_symbols are excluded from target_positions.
# ---------------------------------------------------------------------------
ma_exclusion:
  enabled: true
  exclude_days: 60               # Exclude symbol for 60 days after M&A announcement
  news_categories: ["ma_activity", "merger", "acquisition"]  # trigger categories

market_stress:
  enabled: true
  lookback_days: 20
  metrics:
    vol_z:
      enabled: true
      z_threshold: 1.5
    dd_lookback:
      enabled: true
      dd_threshold: -0.05
  confirm_rule:
    mode: "any"
  qc:
    if_data_missing: false
  exposure_scaling:
    stress_score_1: 0.75          # moderate stress (1 trigger) -> 75% exposure
    stress_score_2: 0.50          # high stress (2 triggers) -> 50% exposure

risk_state_machine:
  enabled: true
  state_path: "output/state/risk_state.json"
  persistence:
    mode: "live"
    per_run_dir: "output/state/runs"
    lock:
      enabled: true
      retries: 5
      backoff_ms: 50
  hysteresis:
    activate_score: 2
    deactivate_score: 1
    pause_score: 3
    confidence_floor: 0.60
    require_market_stress_confirm: true
    require_disclosures_confirm: false
    disclosures_min_severity: 1
    disclosures_confirm_gate:
      enabled: true
      min_geo_score: 3
      on_states: ["WATCH", "COOLDOWN"]
  cooldown:
    hours: 24
  pause:
    enabled: false
    require_confidence: 0.80
    hours: 12
  qc:
    if_intel_degraded: "WATCH"


# ---------------------------------------------------------------------------
# Regime detection (Phase 0D)
# ---------------------------------------------------------------------------
regime_detection:
  enabled: true
  method: "hmm"              # "hmm" | "multifeature_hmm" | "rule_based"
  n_regimes: 3               # bull / bear / sideways
  benchmark_symbol: "SPY"
  multifeature: false        # true → MultiFeatureRegimeHMM (4 observables)
  min_history_days: 120      # minimum trading days before HMM fit

# ---------------------------------------------------------------------------
# Signal generation mode (Phase 0.1)
# ---------------------------------------------------------------------------
signal_generation:
  mode: "multifactor"        # "ema" | "multifactor" | "ml_enhanced"
  multifactor:
    top_n: 15                # long candidates
    bottom_n: 5              # short candidates (if shorts_allowed)
    score_method: "adaptive" # "static" | "adaptive" (IC-weighted)
    regime_blending: true    # use regime-conditional weights
    sector_neutralize: false # sector-bias elimination (Phase 9)
  ml_enhanced:
    meta_model_path: "models/meta/meta_model_latest.joblib"
    confidence_threshold: 0.55
    scale_by_confidence: true
    use_stacking: true
    use_quantile_sizing: false

  # Phase 9: Sector rotation overlay (read by trading_cycle at signal_generation.sector_rotation)
  # Activated 2026-04-22 — ctx.sector_rotation_scores now populated by paper/intel_context.py
  sector_rotation:
    enabled: true            # wired to generate_sector_rotation_signals() via ctx population
    long_weight: 0.12        # per-sector long ETF weight
    short_weight: 0.08       # per-sector short ETF weight (absolute)

  # Phase 9: Pre-earnings signal suppression + PEAD (read by trading_cycle at signal_generation.earnings_guard)
  # Activated 2026-04-22 — ctx.earnings_calendar loaded from cache by paper/intel_context.py
  # Cache refreshed via scripts/fetch_earnings_calendar.py; safe no-op if cache missing
  earnings_guard:
    enabled: true            # suppress signals 3d before earnings + PEAD drift when cache present
    suppress_window: 3       # days before earnings to zero out mean-reversion signals
    pead_window_days: 60     # PEAD drift window (days after earnings)
    pead_weight: 0.15        # weight added to score from PEAD signal

  # Phase 9: Bayesian signal confidence scoring (read by trading_cycle at signal_generation.bayesian_confidence)
  bayesian_confidence:
    enabled: true            # Bayesian CI scoring for position scaling; BL max_weight=0.15 caps inflation
    ci_level: 0.90           # credible interval level (90%)
    max_scale: 1.50          # maximum position scale factor from confidence
    min_scale: 0.50          # minimum position scale factor from confidence

  # Phase 9: Signal health diagnostics at end of each cycle (read by trading_cycle at signal_generation.signal_diagnostics)
  signal_diagnostics:
    enabled: true            # emit compute_signal_health() JSON artifact (no behavior side-effects)
    forward_returns_col: "return_1d"
    ic_alert_threshold: 0.0  # rolling IC below this triggers WARNING
    output_dir: "output/diagnostics"

# ---------------------------------------------------------------------------
# Position sizing (Phase 0C)
# ---------------------------------------------------------------------------
position_sizing:
  method: "black_litterman"    # "equal_weight" | "score_weighted" | "vol_scaled" | "black_litterman" | "cost_aware" | "hrp"
  black_litterman:
    risk_aversion: 2.5
    tau: 0.05
    max_weight: 0.15
    min_history_days: 60       # fallback to vol_scaled if insufficient data
  fallback_method: "vol_scaled"  # used when BL fails to converge
  # Part B deeper wiring (2026-04-22): compute half-Kelly weights with
  # conformal-uncertainty discount IN PARALLEL to the active method.
  # Purely observational — written to result.meta.kelly_uncertainty_shadow
  # for ML training-data collection. Does NOT change result.target_positions.
  kelly_uncertainty_shadow:
    enabled: true
    fractional_kelly: 0.5
    max_fraction: 0.25
    vol_lookback_days: 60
    reference_half_width: null   # null → no uncertainty discount until calibrated
    normalize: true
  # Quantile-interval sizing overlay (LightGBM q05/q95, v3 panel-native names, 91.5% coverage)
  conformal:
    enabled: false                 # v3 A/B (2023-26, post-rebalance-fix): CAGR -3.99pp, Sharpe -0.175, MDD +0.07pp -- K4 NOT met
    model_path: "models/conformal_position_v3.joblib"
  # HRP sizing config — activate by setting method: "hrp" above.
  # OFF by default; uses Lopez de Prado HRP blended with score-based baseline.
  # hrp_sizing module: src/assembled_core/portfolio/hrp_sizing.py
  hrp:
    enabled: false               # set true when method: "hrp" is active (informational flag)
    lookback_days: 60            # rolling return window for covariance estimation
    blend: 0.7                   # HRP weight share (0.7 = 70% HRP, 30% score-based)
    min_weight: 0.0              # per-asset weight floor
    max_weight: 1.0              # per-asset weight cap
    target_invested_pct: 1.0    # gross exposure normalisation target

# ---------------------------------------------------------------------------
# Trailing Stops configuration (Item 76)
# Source of truth for trailing_stops.py and _tc_sizing.py stop-loss logic.
# atr_multiplier: stop = max(min_stop_pct, atr_20d * atr_multiplier)
# Behaviour: volatile symbols (high ATR) get wider stops, stable symbols get tighter.
# ---------------------------------------------------------------------------
trailing_stops:
  enabled: true
  atr_multiplier: 2.5         # stop = max(min_stop_pct, atr_20d * 2.5) — e.g. NVDA 3% ATR -> 7.5%
  min_stop_pct: 0.05          # absolute floor regardless of ATR (5%)
  max_stop_pct: 0.35          # absolute ceiling (35%) — prevents stops that never trigger
  # Per-regime overrides: tighten stops in crisis (reduce loss capture time)
  regime_overrides:
    crisis:
      atr_multiplier: 2.0     # tighter in crisis — exit faster
    bear:
      atr_multiplier: 2.2
    sideways:
      atr_multiplier: 2.5     # default
    bull:
      atr_multiplier: 2.5     # default

# ---------------------------------------------------------------------------
# HMM Regime Overlay — portfolio exposure multiplier based on detected regime
# ---------------------------------------------------------------------------
hmm_regime_overlay:
  enabled: false                   # v3 A/B (2023-26): CAGR +1.41pp, Sharpe -0.005, MDD -0.92pp -- Sharpe criterion not met
  model_path: "models/regime_hmm_4state_spy.joblib"
  multipliers:
    bull: 1.15                     # slightly more aggressive in bull
    sideways: 1.00                 # neutral
    bear: 0.75                     # reduce exposure in bear
    crisis: 0.40                   # significant reduction in crisis

# ---------------------------------------------------------------------------
# EDCL — Event-Driven Conviction Layer (Phase A foundation)
# Separate upscaling term; live/paper only by default.
# Activation criterion: paper-run 30 days + 15% net improvement over baseline.
# DO NOT enable until paper-trading validation complete.
# ---------------------------------------------------------------------------
edcl_conviction_overlay:
  enabled: true                    # Paper-Trading validation phase (2026-05-05)
  conviction_threshold: 0.85      # Wave 4: raised from 0.70 — high-conviction only
  max_multiplier: 2.0             # hard ceiling on EDCL multiplier
  allow_in_backtest: false        # do not apply live-fetch signals in backtest
  use_historical_beta: true       # Phase C: enrich conviction with event-beta from FeatureStore
  # Phase E: conformal sizing for EDCL-triggered trades
  edcl_sizing:
    enabled: true                 # active during paper-run validation
    model_path: "models/conformal_position_v3.joblib"
    target_coverage: 0.85        # 85% coverage target for EDCL positions
    max_edcl_weight: 0.30        # max single-asset weight in EDCL-driven trade

# ---------------------------------------------------------------------------
# Anti-churn / hysteresis (Phase 0D)
# ---------------------------------------------------------------------------
anti_churn:
  ranking_hysteresis_enabled: true
  entry_n: 5                   # new positions need top-5 rank
  hold_n: 7                    # existing positions stay if top-7
  deadzone_enabled: true
  deadzone_pct: 0.02           # rebalance only if weight diff > 2%
  rebalance_filter_enabled: true
  min_notional: 500.0          # drop orders below $500 notional value
  # NOTE: sector_rotation / earnings_guard / bayesian_confidence / signal_diagnostics
  # were moved to top-level `signal_generation:` (that is where trading_cycle.py
  # reads them). Leaving them under `anti_churn:` was a silent no-op.

evidence_engine:
  enabled: true
  require_grade_for_active: "B"   # minimum evidence grade to allow WATCH->ACTIVE
  misinfo_risk_threshold: 0.70    # misinfo score above this blocks grade A
  grades:
    A:
      description: "Strong: >=2 Tier-A OR >=3 independent Tier-B, low misinfo risk"
    B:
      description: "Moderate: >=1 Tier-A OR >=2 independent Tier-B, acceptable misinfo"
    C:
      description: "Weak: >=1 source but below B threshold"
    D:
      description: "Insufficient: no qualifying evidence or misinfo too high"

# ---------------------------------------------------------------------------
# Paper trading engine selection
# ---------------------------------------------------------------------------
paper_trading:
  engine: "unified"              # "unified" uses UnifiedPaperEngine; other values fall back to legacy PaperTrackRunner
  seed_capital: 100000.0
  enable_ledger: true
  enable_reconciliation: true
  enable_fat_finger: true

# ---------------------------------------------------------------------------
# Fat-finger guard (pre-trade order size cap)
# ---------------------------------------------------------------------------
fat_finger_guard:
  enabled: true
  max_notional_usd: 500000.0      # reject any single order > $500k notional
  max_qty_multiple: 5.0           # reject if qty > 5× symbol's recent max qty

# ---------------------------------------------------------------------------
# Data freshness / stale-feature monitoring
# ---------------------------------------------------------------------------
freshness_monitor:
  enabled: true
  stale_feature_days: 5           # flag features constant for > 5 days

# ---------------------------------------------------------------------------
# Cost-aware weight shrinkage (Step 4.85 — reduces oversizing on expensive trades)
# ---------------------------------------------------------------------------
cost_aware_wrapper:
  enabled: false                  # start disabled — behavior change on target_weights
  penalty_factor: null            # null = auto (0.5 * invested_pct)
  min_shrink: 0.0

# ---------------------------------------------------------------------------
# Borrow cost estimation for short positions (Step 6.8)
# ---------------------------------------------------------------------------
borrow_costs:
  enabled: true
  default_rate_bps: 50.0          # easy-to-borrow annualised bps
  htb_rate_bps: 500.0             # hard-to-borrow annualised bps

# ---------------------------------------------------------------------------
# ML drift detection (Step 2.4 — KS-test on feature distributions)
# ---------------------------------------------------------------------------
ml:
  drift_detection:
    enabled: true
    p_value_threshold: 0.01       # KS p-value < this → feature drifted
  retrain_schedule: weekly        # Options: daily, weekly, monthly, manual
  retrain_trigger: drift          # Options: time, drift, manual
  model_max_age_days: 14          # Alert if deployed model older than this

# ---------------------------------------------------------------------------
# Signal meta-model confidence scoring (Step 3.7 — shadow only)
# ---------------------------------------------------------------------------
signals:
  meta_model_scoring:
    enabled: false                 # legacy path — use meta_model below
    model_path: "output/models/meta/meta_model.joblib"
  # LightGBM meta-model filter v6 (AUC=0.5108, macro+fundamentals+earnings, PIT-safe)
  # v2 (AUC=0.649) had look-ahead bias; v6 is the most rigorous model with purged split.
  # Activation threshold: AUC >= 0.55 (not yet met — empirical ceiling ~0.511 with TA+macro data).
  meta_model:
    enabled: false                 # enable only when AUC >= 0.55 is achieved
    model_path: "models/meta_model_lgbm_v6.joblib"
    confidence_threshold: 0.52    # conservative threshold for AUC ~0.51 model
    scale_by_confidence: true     # multiply mf_score by confidence_score

# ---------------------------------------------------------------------------
# Multi-factor composite signal (Step 3.55 — shadow mf_score on signals)
# ---------------------------------------------------------------------------
multifactor_signal:
  enabled: true
  bundle_path: "configs/factor_bundles/macro_world_etfs_core_bundle.yaml"

# ---------------------------------------------------------------------------
# Phase 10: Monte Carlo robustness (bootstrap after each cycle / backtest)
# ---------------------------------------------------------------------------
monte_carlo:
  auto_run: false            # if true: bootstrap_returns() runs after each trading cycle
  n_paths: 500               # bootstrap paths (500 = fast; use 1000+ for reports)
  confidence_level: 0.95     # CI level
  seed: null                 # null = random; set integer for reproducibility

# Phase 10: Parameter robustness (optional, heavier — intended for batch runs)
robustness:
  enabled: false             # gate: enable run_param_grid_sweep() on batch backtest
  deterministic: true

# Phase 10: Regime-aware walk-forward validation
regime_walk_forward:
  enabled: false             # gate: enable regime-aware WF as validation step

# ---------------------------------------------------------------------------
# Phase 11: Alert system
# ---------------------------------------------------------------------------
alerts:
  enabled: true              # enable alert_health_worker in daily_scheduler
  rate_limit_seconds: 300    # seconds between identical alert messages
  output_dir: "output/alerts"
  sinks:
    email:
      enabled: false         # enable EmailSink (set ASSEMBLED_SMTP_* env vars)
      min_severity: "CRITICAL"

# Phase 11: KPI / Prometheus metrics export
kpi_export:
  enabled: true              # enable metrics_exporter + kpi_export_worker
  output_dir: "output/metrics"
  gateway_url: null          # set to Prometheus Pushgateway URL if desired

# ---------------------------------------------------------------------------
# Ultra-Plan Part D — shadow-mode gates for activation observation.
# All default shadow_only=true. Flip to false only after 5 trading-day
# observation window documented in output/activation_ledger.md.
# ---------------------------------------------------------------------------
correlation_guard:
  shadow_only: true          # D1 — compute but do not apply scaled weights
  max_pairwise_corr: 0.8
zombie_killer:
  shadow_only: true          # D2 — log zombies but do not force-flat
  max_hold_days: 30
  stale_signal_bars: 10
crash_prediction:
  shadow_only: true          # D3 — long-gross equity cap shadow-only
  equity_cap_enabled: true
  equity_cap_threshold: 0.4
  base_long_gross: 1.0
inverse_etf:
  shadow_only: true          # D4 — hedge recommendation only
  enabled: true              # activate gate evaluation (recording still shadow)
  vix_threshold: 25.0
  crash_prob_threshold: 0.4
  hedge_ratio: 0.1
  max_holding_days: 5
signal_decay:
  shadow_only: true          # D5 — apply multipliers only when false
  enabled: false
  stale_multiplier: 0.0

# ---------------------------------------------------------------------------
# T4.6: Feature-Flag declarations (N1 — all 10 flags previously undefined).
# Builders read these flags at runtime; missing flag → KeyError (not silent pass).
# ---------------------------------------------------------------------------
features:
  news_count_7d: true
  news_count_30d: true
  news_sentiment_7d: true
  news_sentiment_30d: true
  news_sentiment_z: true
  news_volume_spike: true
  news_sentiment_shock: true
  macro_growth_regime: true
  macro_inflation_regime: true
  macro_risk_aversion: true
  news_features:
    enabled: false          # requires ctx.news_events; enable when news pipeline feeds events
    short_window: 7
    long_window: 30
  enhanced_factors:
    enabled: true
  realized_volatility:
    enabled: true
    windows: [20, 60]            # rv_20 and rv_60; required by macro_world_etfs_core_bundle
  behavioral_features:
    enabled: true
    min_rows: 60                  # min history per symbol to compute composite
    ta_factors_core: true           # add multi-horizon returns, trend strength, reversal
    cross_sectional_rank: true      # rank-normalize key features across symbols per day
    rank_normalize_to: "symmetric"  # -1..+1 symmetric percentile rank
    rank_cols:
      - trend_ema_spread
      - mom_rsi_centered
      - mom_12_1
      - low_vol_rank
      - quality_score
      - trend_strength_20
      - trend_strength_50
      - momentum_12m_excl_1m

# Multi-strategy ensemble (Plan 11/10 §1.1.1)
# enabled: false until A/B backtest confirms Sharpe delta >= 0 AND MDD delta <= 1.5pp
strategies:
  ensemble:
    enabled: false
    method: "weighted_average"
    members:
      multifactor_v2:
        weight: 0.40
        regime_aware: true
      composite_score_v1:
        weight: 0.30
        regime_aware: true
      multifactor_long_short:
        weight: 0.20
        regime_aware: false
      ema_trend_v0:
        weight: 0.10
        regime_aware: false
    min_consensus: 0.30

# ---------------------------------------------------------------------------
# Quarter-End High-Friction Days (Item 84) — March 31, June 30, Sep 30, Dec 31
# Window-dressing and fund rebalancing cause 2-3× higher slippage.
# ---------------------------------------------------------------------------
quarter_end_guard:
  enabled: true
  days_before: 2                  # flag window: 2 trading days before quarter-end
  slippage_multiplier: 2.0        # applied to estimated slippage for sizing
  max_position_size_pct: 0.50     # cap individual positions at 50% of normal max

# ---------------------------------------------------------------------------
# Quant Promotion Gates — Bailey/López de Prado 2012/2014/2015
#   Read by qa/qa_gates and the backtest reporter. A candidate strategy
#   may NOT be promoted to paper-track when any "block_threshold" is
#   breached. "warn_threshold" raises a WARN annotation in the report.
#
#   Defaults follow the audit recommendation (Runde 3, Teil D + W-005)
#   and are conservative enough for solo-quant publication.
# ---------------------------------------------------------------------------
quant_gates:
  enabled: true
  deflated_sharpe:
    enabled: true
    block_threshold: 0.0          # DSR must be > 0 (Sharpe survives the FDR adjustment)
    warn_threshold: 0.5
  probabilistic_sharpe:
    enabled: true
    block_threshold: 0.95         # PSR(SR* = 0) >= 0.95 required for promotion
    warn_threshold: 0.90
    benchmark_sharpe: 0.0
  pbo:
    enabled: true
    block_threshold: 0.50         # CSCV-PBO must be < 0.50 to promote
    warn_threshold: 0.30
  min_trl:
    enabled: true
    confidence: 0.95
    # MinTRL is observed, not thresholded — but a candidate with MinTRL > n_obs
    # is by definition not yet sufficiently track-recorded.
    block_when_below_observed_track: true

# ---------------------------------------------------------------------------
# Paper Pilot — verbindliche Betriebsparameter (GO_LIVE B3 + C3, 2026-05-28)
# ---------------------------------------------------------------------------
paper_pilot:
  # INFRASTRUKTUR-ERPROBUNG — kein Alpha-Betrieb.
  # Abschluss-Entscheidung 2026-05-29 (docs/PROJEKT_ABSCHLUSS_2026_05.md §4):
  #   Strategische Richtung: passiver Kern (SPY/AGG) + vol_target_overlay als Drawdown-Schutz.
  #   trend_baseline hält den Paper-Runner aktiv; kein Go-Live ohne validierten Edge.
  #   OOS (2018-2025, 10 Folds): -6.1% CAGR — GO_LIVE B1 negativ.
  # paper_runner liest diesen Key; Fallback: app_cfg["paper_runner"]["strategy"]["name"].
  active_strategy: trend_baseline

  # Transaktionskostenmodell.
  # ANNAHME, nicht gegen echte Fills kalibriert.
  # Quelle: OOS-Läufe 2026-05 (scripts/_oos_walk_forward_trend_baseline.py).
  # Kalibrierung gegen echte Fills erst relevant wenn GO_LIVE-Edge nachgewiesen (kein offener TODO).
  cost_model:
    commission_bps: 10.0   # 10 bps je Trade (~$100/100k Volumen) — konservative Annahme
    # spread_w + impact_w: Von simulate_fills als Slippage-Fallback genutzt (sum = 0.75 bps),
    # wenn slippage_bps = 0. Auch von paper_track.py und backtest_engine.py (× 1e-4 = bps-Einheit).
    spread_w: 0.25         # 0.25 bps Halbspread-Äquivalent (Almgren-Chriss)
    impact_w: 0.5          # 0.5 bps Market-Impact-Äquivalent (Almgren-Chriss)
