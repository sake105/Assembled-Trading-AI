# Multi-channel alerting configuration (Plan 11/10 §4.1)
# Environment variables referenced here must be set in .env (never commit credentials)

alerts:
  # Channel definitions
  channels:
    critical:
      - type: telegram
        chat_id_env: "TELEGRAM_CHAT_ID"        # env var holding chat ID
        bot_token_env: "TELEGRAM_BOT_TOKEN"    # env var holding bot token
      - type: email
        to_env: "ALERT_EMAIL_TO"               # env var holding recipient
        smtp_host_env: "SMTP_HOST"
        smtp_port: 587
        smtp_user_env: "SMTP_USER"
        smtp_pass_env: "SMTP_PASS"
    warning:
      - type: telegram
        chat_id_env: "TELEGRAM_CHAT_ID"
        bot_token_env: "TELEGRAM_BOT_TOKEN"
    info:
      - type: log_only

  # Alert rules
  rules:
    - name: "kill_switch_activated"
      severity: critical
      message: "KILL-SWITCH ACTIVATED: {reason}"
      cooldown_minutes: 0

    - name: "daily_pnl_loss_limit"
      severity: critical
      message: "Daily P&L {daily_pnl_pct:.2%} hit hard limit"
      cooldown_minutes: 60

    - name: "broker_connection_failure"
      severity: critical
      message: "Broker connection failed: {error}"
      cooldown_minutes: 10

    - name: "sanity_check_halt"
      severity: critical
      message: "Order halted by sanity check: {symbol} — {flags}"
      cooldown_minutes: 5

    - name: "data_freshness_stale"
      severity: warning
      message: "Data older than {max_age_hours}h: {symbols_stale}"
      cooldown_minutes: 120

    - name: "drift_threshold_exceeded"
      severity: warning
      message: "Feature drift PSI={max_psi:.3f} on {feature_name}"
      cooldown_minutes: 240

    - name: "fill_rate_low"
      severity: info
      message: "Fill rate today: {daily_fill_rate:.0%}"
      cooldown_minutes: 1440

    - name: "cycle_error"
      severity: warning
      message: "Trading cycle error: {error}"
      cooldown_minutes: 15

    # Reconciliation SLO breaches (fired by accounting/reconciliation.py:evaluate_reconcile_slo).
    # Context keys must match the fire() call: cash_diff_bps, max_qty_diff, violation_count, first_violation.
    - name: "reconciliation_fail"
      severity: critical
      message: "RECONCILE FAIL: cash diff {cash_diff_bps} bps, max qty diff {max_qty_diff}, {violation_count} violation(s) (first: {first_violation})"
      cooldown_minutes: 60

    - name: "reconciliation_warn"
      severity: warning
      message: "RECONCILE WARN: cash diff {cash_diff_bps} bps, max qty diff {max_qty_diff}, {violation_count} violation(s) (first: {first_violation})"
      cooldown_minutes: 120

    # Volatility circuit-breaker trip (fired by risk/circuit_breaker.py:VolCircuitBreaker).
    # Context keys: ratio, threshold, trip_count.
    - name: "circuit_breaker_tripped"
      severity: critical
      message: "CIRCUIT BREAKER TRIPPED: vol ratio {ratio} > threshold {threshold} (trip #{trip_count})"
      cooldown_minutes: 5
