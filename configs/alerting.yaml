# Multi-channel alerting configuration (Plan 11/10 §4.1)
# Environment variables referenced here must be set in .env (never commit credentials)
# Nachrichtentexte auf Deutsch (2026-06-23). Platzhalter {…} NICHT übersetzen — sie werden
# per .format(**context) befüllt; Änderung der Keys würde den fire()-Aufruf brechen.

alerts:
  # Channel definitions
  channels:
    critical:
      - type: log_only
      - type: telegram
        chat_id_env: "TELEGRAM_CHAT_ID"        # env var holding chat ID
        bot_token_env: "TELEGRAM_BOT_TOKEN"    # env var holding bot token
      - type: email
        to_env: "ALERT_EMAIL_TO"               # env var holding recipient
        smtp_host_env: "SMTP_HOST"
        smtp_port: 587
        smtp_user_env: "SMTP_USER"
        smtp_pass_env: "SMTP_PASS"
    warning:
      - type: log_only
      - type: telegram
        chat_id_env: "TELEGRAM_CHAT_ID"
        bot_token_env: "TELEGRAM_BOT_TOKEN"
    info:
      - type: log_only

  # Alert rules
  rules:
    - name: "kill_switch_activated"
      severity: critical
      message: "KILL-SWITCH AKTIVIERT: {reason}"
      cooldown_minutes: 0

    - name: "daily_pnl_loss_limit"
      severity: critical
      message: "Tages-P&L {daily_pnl_pct:.2%} hat das harte Limit erreicht"
      cooldown_minutes: 60

    - name: "broker_connection_failure"
      severity: critical
      message: "Broker-Verbindung fehlgeschlagen: {error}"
      cooldown_minutes: 10

    - name: "sanity_check_halt"
      severity: critical
      message: "Order durch Sanity-Check gestoppt: {symbol} — {flags}"
      cooldown_minutes: 5

    - name: "data_freshness_stale"
      severity: warning
      message: "Daten älter als {max_age_hours}h: {symbols_stale}"
      cooldown_minutes: 120

    - name: "drift_threshold_exceeded"
      severity: warning
      message: "Feature-Drift PSI={max_psi:.3f} bei {feature_name}"
      cooldown_minutes: 240

    - name: "fill_rate_low"
      severity: info
      message: "Fill-Rate heute: {daily_fill_rate:.0%}"
      cooldown_minutes: 1440

    - name: "cycle_error"
      severity: warning
      message: "Trading-Zyklus-Fehler: {error}"
      cooldown_minutes: 15

    # Reconciliation SLO breaches (fired by accounting/reconciliation.py:evaluate_reconcile_slo).
    # Context keys must match the fire() call: cash_diff_bps, max_qty_diff, violation_count, first_violation.
    - name: "reconciliation_fail"
      severity: critical
      message: "RECONCILE FAIL: Cash-Differenz {cash_diff_bps} bps, max Mengen-Diff {max_qty_diff}, {violation_count} Verletzung(en) (erste: {first_violation})"
      cooldown_minutes: 60

    - name: "reconciliation_warn"
      severity: warning
      message: "RECONCILE WARN: Cash-Differenz {cash_diff_bps} bps, max Mengen-Diff {max_qty_diff}, {violation_count} Verletzung(en) (erste: {first_violation})"
      cooldown_minutes: 120

    # Volatility circuit-breaker trip (fired by risk/circuit_breaker.py:VolCircuitBreaker).
    # Context keys: ratio, threshold, trip_count.
    - name: "circuit_breaker_tripped"
      severity: critical
      message: "CIRCUIT BREAKER AUSGELÖST: Vol-Ratio {ratio} > Schwelle {threshold} (Auslösung #{trip_count})"
      cooldown_minutes: 5

    # Paper-pilot watchdog rules (fired by ops/alerting.py AlertManager).
    - name: halt_flag_set
      severity: critical
      cooldown_minutes: 60
      message: "PILOT-HALT gesetzt: {reason} (Equity={equity}). Quittieren via scripts/ack_halt.py."

    - name: halt_cleared
      severity: warning
      cooldown_minutes: 0
      message: "PILOT-Halt aufgehoben von {actor}: {reason}."

    - name: liquidation_warning
      severity: critical
      cooldown_minutes: 120
      message: "AUTO-LIQUIDATION in {window_hours}h, falls der Halt nicht jetzt quittiert wird (seit {age_h}h offen). scripts/ack_halt.py"

    - name: liquidation_executed
      severity: critical
      cooldown_minutes: 0
      message: "AUTO-LIQUIDATION ausgelöst (Modus={mode}): {detail}"

    - name: heartbeat_stale
      severity: critical
      cooldown_minutes: 180
      message: "Pilot-Heartbeat VERALTET: {source} Alter={age_h}h (Schwelle {threshold_h}h)."

    - name: zero_orders_unexpected
      severity: warning
      cooldown_minutes: 720
      message: "Pilot hat in {streak} Werktags-Läufen 0 Orders erzeugt (letzter rc={rc})."

    - name: drawdown_breach
      severity: critical
      cooldown_minutes: 360
      message: "Pilot-Drawdown {dd_pct}% hat Limit {limit_pct}% verletzt (Equity={equity})."

    # 2026-08-16 (Audit-Plan 2.5b): erster Konsument des E-112-Anfrage-
    # Protokolls. yfinance ist der einzige lebende Preispfad — wenn dessen
    # juengstes pull_log eine hohe Fehlerquote traegt, lief der Pilot auf
    # unvollstaendigen Preisen.
    - name: pull_log_errors
      severity: warning
      cooldown_minutes: 360
      message: "yfinance-Pull-Protokoll {log}: {n_error}/{requested} Requests fehlgeschlagen (Quote {ratio}, Schwelle {threshold})."

    # 2026-08-17 (E-176-Konsument): erster Leser des sector_etf-Status-JSONs.
    # Ein Naht-Abbruch (ok=false) oder dauerhaft gedroppte Symbole (der
    # Drop-Pfad endet mit Exit 0!) erreichten vorher keinen Menschen.
    - name: sector_refresh_degraded
      severity: warning
      cooldown_minutes: 360
      message: "Sector-ETF-Refresh degradiert: rc={rc}, dropped=[{dropped}], error={error}"

  watchdog:
    warn_after_trading_days: 1
    liquidate_after_warning_hours: 4
    heartbeat_stale_hours: 26
    zero_order_days: 2
    dd_breach_pct: -8.0
    flatten_mode: shadow
    pull_log_error_ratio: 0.5
    pull_log_min_requested: 5   # Mindestnenner: 1-von-2-Kleinlaeufe alarmieren nicht
