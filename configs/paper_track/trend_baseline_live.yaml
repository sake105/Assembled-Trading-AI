# Paper Track Config - Trend Baseline LIVE
#
# First real paper trading run using fresh yfinance data (52 symbols, 2021-2026).
# Strategy: EMA 20/50 crossover, long-only, top 10 positions.
# Capital: 100,000 USD
#
# Usage:
#   py -3 scripts/run_paper_track.py --config-file configs/paper_track/trend_baseline_live.yaml --as-of 2026-04-02

strategy_name: "trend_baseline_live"
strategy_type: "trend_baseline"

universe:
  file: "configs/paper_track/watchlist_us_core.txt"

trading:
  freq: "1d"

strategy:
  params:
    ma_fast: 20
    ma_slow: 50
    top_n: 10
    min_score: 0.0

portfolio:
  seed_capital: 100000.0

costs:
  commission_bps: 5.0
  spread_w: 0.25
  impact_w: 0.5

output:
  output_root: null
  format: "csv"

random_seed: 42

integration:
  enable_pit_checks: true

# Pilot-phase risk limits (Pre-Flight Check 6)
risk_limits:
  max_total_exposure_pct: 0.30       # max 30% of capital deployed
  max_position_pct: 0.05             # max 5% per symbol
  max_daily_orders: 10               # safety cap
  max_daily_loss_pct: -0.02          # -2% day → trigger halt review
  allowed_order_types: [limit]       # no market orders in pilot
  default_limit_offset_bps: 5        # 5 bps inside spread
  forbidden_symbols: []              # add GME/AMC etc. if needed

# Auto-halt rules (supplementary to kill-switch)
auto_halt:
  on_consecutive_losing_days: 3      # 3 red days → pause + review
  on_drawdown_pct: -0.05             # -5% MDD from pilot start → halt
  on_position_count_anomaly: 50      # >50 open positions = likely bug
