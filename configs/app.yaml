paper_runner:
  mode: "paper"           # shadow|paper
  start_capital: 87874.90 # 2026-07-02 reset: baseline = Alpaca equity at reactivation (was 100000.0)
  dd_stop_pct: 0.20       # 2026-08-09 (Hans): ack-Halt auf Kill-Level der DD-Treppe (-20% von start_capital). Treppe (policy.yaml drawdown_policy, vs. HWM seit hwm_since): -10% -> Order-QTY x0.5 (zustandslos, erholt sich mit dd), -15% -> x0.2, -20% -> persistenter Kill-Switch (OPERATOR_KILL_TOKEN) + dieser ack-Halt. Vorher 0.10 (02.07.); default 0.30 if absent. Gilt nur fuer mode=paper (shadow hat keinen Ledger -> Treppe inert). BEWUSSTE Eigenschaften der Drossel: (a) seitenagnostisch — auch De-Risking-SELLs werden skaliert (identisch zur Kill-Switch-Guard-Semantik); (b) gedrosselte Orders durchlaufen weiterhin deadzone/min_notional 500 -> einzelne kleine Orders koennen ganz entfallen; ein komplett leergefilterter Batch wird NICHT ausgefuehrt (der fruehere Fallback auf den ungefilterten Batch ist entfernt, F-senior-1/E-136)
  hwm_since: "2026-07-02" # HWM-Basis der DD-Treppe: Ledger-Kurvenpunkte vor diesem Datum zaehlen nicht (Baseline-Reset-Governance vom 02.07.; Alt-Peak 99036 vom 06.05. wuerde sonst sofort die Treppe ausloesen). Peak startet nie unter start_capital.
  output_dir: "output/runs"
  include_news_pipeline: false
  as_of: null             # optional timestamp override
  ledger_path: "output/runs/_paper_ledger/ledger_state.json"  # paper mode only
  strategy:
    # §9.6 (b) Phase 2 (2026-05-21): primary switched from multifactor_v2 to
    # trend_baseline. Backtest evidence: trend_baseline OOS 2025-01..05 =
    # +43.02% CAGR / 1.44 Sharpe vs mfv2 -7.74% baseline. Phase-1 shadow-mode
    # collected ~1 dry-run-day of overlap data (28 LONG vs 5 LONG, overlap 2).
    # Phase-2 pre-conditions: (i) check_exit_signals ✅ (closed via
    # strategies/trend_baseline.py); (ii) shadow whitelist WARN ✅;
    # (iii) feature-pipeline-alignment doc ✅; (iv-vi) operator-validation
    # required — Stage-1 risk-execution-reviewer must sign off.
    name: "trend_baseline"   # multifactor_v2 | multifactor_v1 | ema_trend_v0 | trend_baseline | none
    ma_fast: 20                 # trend_baseline MA-crossover fast window
    ma_slow: 60                 # trend_baseline MA-crossover slow window
    ema_fast: 20                # (legacy; ema_trend_v0 uses these)
    ema_slow: 60
    equal_weight: false         # (legacy; trend_baseline uses target_invested_pct/n)
    max_positions: 30           # cap equal-weight basket to top 30 LONGs by score
    min_position_weight: 0.03   # 3% minimum per position
    target_invested_pct: 0.80   # 80% capital target (20% cash reserve)
    min_signal_score: 0.0       # minimum composite score for LONG signal
    # Exit management (trend_baseline uses these via check_exit_signals)
    stop_loss_pct: 0.08         # 8% stop-loss below entry
    trailing_stop_pct: 0.10     # 10% trailing stop below HWM
    take_profit_pct: 0.15       # 15% profit -> sell 50% (rest under trailing)

  # §9.6 (a) ADV universe filter (2026-05-21): optional restriction to the
  # top-N most liquid symbols by trailing dollar-volume. Reduces transaction-
  # cost drag from illiquid tail names. Backtest evidence: mfv2 Top-50 daily
  # = +5.70% CAGR vs all-195-daily = -7.74%; illiquidity drag was the bulk of
  # the delta. Default: filter OFF (full watchlist). Enable by setting
  # min_adv_top_n to a positive int (e.g. 50 for top-50, 100 for top-100).
  universe:
    min_adv_top_n: null         # null/0 = no filter; e.g. 50 = top-50 by ADV
    adv_lookback_days: 20       # trailing window for dollar-volume mean

  # Reconcile-block gate (SAFETY, default-off): refuse to trade the next
  # paper/live cycle when the last reconcile did not provably pass. Read by
  # ops/_paper_runner_gates.apply_reconcile_block_gate, wired into
  # ops/paper_runner.run_paper_daily_one BEFORE run_trading_cycle. ARMED
  # behaviour is fail-closed: FAIL / unverified / missing / unreadable
  # artifact all BLOCK. Only the live/paper driver reads this — backtest
  # (qa/backtest_engine.py) never reaches this gate. With enabled=false the
  # call is a pure pass-through (byte-identical behaviour).
  reconcile_block:
    # 2026-07-21 (GESAMTBEWERTUNG K5): ARMED. Prerequisite fix shipped same
    # day: ops/paper_runner now writes a stable root-level copy of the
    # artifact (output/reconcile_latest.json) — previously it existed only
    # per-run, so an armed gate could never verify a pass. The initial root
    # artifact was seeded manually from the 2026-07-20 run (documented in
    # docs/GESAMTBEWERTUNG.md §7). RECOVERY after a FAIL/stale deadlock
    # (gate runs BEFORE the cycle, so a blocked pilot never refreshes the
    # artifact itself): fix the root cause, then run
    #   python scripts/ops/rebuild_reconcile_artifact.py --reason "..."
    # which re-evaluates the ledger invariants and writes a fresh artifact
    # (still FAIL if the ledger is actually broken — no bypass).
    enabled: true                               # ARMED (fail-closed)
    block_on: ["fail"]                          # add "unverified" to also block WARN/UNKNOWN
    artifact: "output/reconcile_latest.json"    # resolved relative to repo root
    block_if_stale_hours: 120                   # block stale-OK older than 5 days (covers long weekends)

  # §9.6 (b) Phase 2 shadow-mode (2026-05-21): mfv2 cannot run as shadow
  # under the price-only whitelist (it needs feature-pipeline-enriched
  # input). Disabled until F-S1-M2 feature-pipeline-aligned shadow path is
  # added (KNOWN_ISSUES §9.6 (b) Phase-2 pre-cond iii). Shadow currently
  # supports only trend_baseline + ema_trend_v0 (price-only).
  shadow_strategy:
    enabled: false
    name: "multifactor_v2"      # gated by whitelist; logs WARN and skips
    ema_fast: 20
    ema_slow: 60
    max_positions: 10
    target_invested_pct: 0.80
    min_signal_score: 0.0
    stop_loss_pct: 0.08
    trailing_stop_pct: 0.10
    take_profit_pct: 0.15

  intel:
    mode: "real"           # real | sim | none
    run_news_pipeline: true
    run_disclosures_pipeline: true
    news:
      cadence: "hourly"
      sources_path: "configs/news/sources.yaml"
      config_path: "configs/news/news.yaml"
      output_dir: "output/intel/news"
    disclosures:
      cadence: "daily"
      sources_path: "configs/disclosures/sources.yaml"
      config_path: "configs/disclosures/disclosures.yaml"
      output_dir: "output/intel/disclosures"
  intel_sim:
    enabled: true
    mode: "stress_based"
    disclosures_confirm_every_n_days: 9
    geo_spikes:
      enabled: true
      every_n_days: 7
      geo_score: 3
      geo_confidence: 0.85

alerts:
  enabled: true
  thresholds:
    final_multiplier_drop: 0.20          # delta vs prev <= -0.20 triggers alert
    abs_delta_weight_sum: 0.20          # turnover proxy
    turnover_scale_factor_below: 0.70
    max_severity_ge: 2                  # triggers_summary.max_severity >= 2
  severity_map:
    info: 0
    warn: 1
    critical: 2
