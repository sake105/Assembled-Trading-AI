paper_runner:
  mode: "paper"           # shadow|paper
  start_capital: 100000.0 # match Alpaca paper account
  output_dir: "output/runs"
  include_news_pipeline: false
  as_of: null             # optional timestamp override
  ledger_path: "output/runs/_paper_ledger/ledger_state.json"  # paper mode only
  strategy:
    name: "multifactor_v2"   # multifactor_v2 | multifactor_v1 | ema_trend_v0 | trend_baseline | none
    ema_fast: 20
    ema_slow: 60
    equal_weight: false         # score-based sizing (multi-factor score as weight)
    max_positions: 10           # top-N by composite score
    min_position_weight: 0.03   # 3% minimum per position ($3k at $100k)
    target_invested_pct: 0.80   # 80% capital target (20% cash reserve)
    min_signal_score: 0.0       # minimum composite score for LONG signal
    # Exit management
    stop_loss_pct: 0.08         # 8% stop-loss below entry
    trailing_stop_pct: 0.10     # 10% trailing stop below HWM
    take_profit_pct: 0.15       # 15% profit -> sell 50%

  # §9.6 (b) Phase 1 shadow-mode (2026-05-21): run a second strategy in
  # parallel for signal comparison only. No orders generated, no broker
  # interaction. Writes shadow_signals.json + shadow_targets.json to the
  # daily run directory for post-hoc comparison vs primary signals.
  # Best-effort: any failure logs WARN and continues; never blocks the
  # primary pilot cycle. Backtest evidence: trend_baseline OOS 2025-01..05
  # produced +43.02% CAGR / 1.44 Sharpe vs mfv2 -7.74% baseline.
  shadow_strategy:
    enabled: true
    name: "trend_baseline"
    ma_fast: 20
    ma_slow: 60
    max_positions: 30           # cap equal-weight basket to top 30 LONGs
    target_invested_pct: 1.0

  intel:
    mode: "real"           # real | sim | none
    run_news_pipeline: true
    run_disclosures_pipeline: true
    news:
      cadence: "hourly"
      sources_path: "configs/news/sources.yaml"
      config_path: "configs/news/news.yaml"
      output_dir: "output/intel/news"
    disclosures:
      cadence: "daily"
      sources_path: "configs/disclosures/sources.yaml"
      config_path: "configs/disclosures/disclosures.yaml"
      output_dir: "output/intel/disclosures"
  intel_sim:
    enabled: true
    mode: "stress_based"
    disclosures_confirm_every_n_days: 9
    geo_spikes:
      enabled: true
      every_n_days: 7
      geo_score: 3
      geo_confidence: 0.85

alerts:
  enabled: true
  thresholds:
    final_multiplier_drop: 0.20          # delta vs prev <= -0.20 triggers alert
    abs_delta_weight_sum: 0.20          # turnover proxy
    turnover_scale_factor_below: 0.70
    max_severity_ge: 2                  # triggers_summary.max_severity >= 2
  severity_map:
    info: 0
    warn: 1
    critical: 2
