fetch:
  timeout_s: 10
  retries: 2
  backoff_base_s: 0.5
  max_concurrency: 5
  user_agent: "Assembled-Trading-AI/NEWS-v1"
  sanitize:
    strip_html: true
    title_max_chars: 300
    summary_max_chars: 800

dedupe:
  enabled: true
  window_days: 14
  store:
    backend: "sqlite"
    path: "output/intel/news/cache/dedupe_store.sqlite"
  fingerprint:
    treat_distance0_as_duplicate: true
  near_duplicate:
    enabled: true
    hamming_threshold: 3

clustering:
  enabled: true
  algorithm: "tfidf_cosine"
  similarity_threshold: 0.20
  min_cluster_size: 2
  top_phrases_k: 8
  top_entities_k: 8
  max_pair_checks: 5000
  require_overlap: false
  same_day_only: false

burst:
  enabled: false
  baseline_days: 30
  min_doc_count: 3
  top_k: 50
  version_salt: "v1"
  windows_hours: [1, 6, 24]

trigger_scoring:
  enabled: true
  severity_cap_degraded: 1
  severity_cap_error: 0

ttl_decay:
  enabled: false

gdelt:
  enabled: true
  rate_limit_rps: 1
  cache_minutes: 10
  stale_on_error_minutes: 60
  window_hours:
    hourly: 1
    daily: 6
  queries:
    - "war OR sanctions OR shipping OR Red Sea OR Suez OR Taiwan OR Strait of Hormuz OR export controls"

health:
  min_sources_ok: 1

cadence:
  modes: ["hourly", "daily"]

