# pytest.ini - Pytest configuration for Assembled Trading AI
[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization.
#
# Canonical markers (P0 A9, Deep Run v2, 2026-04-18):
#   fast         — unit-level tests, should run in << 1s
#   integration  — multi-module integration tests
#   regression   — regression / parity / invariant gates (E0, speed, realism, depth)
#   smoke        — end-to-end smoke tests
#
# Legacy phase markers (phase4/6/7/8/9/10/11/12/13, phase_zero/speed/realism/depth)
# are retained here for declaration-compatibility and aliased to a canonical marker
# in `tests/conftest.py::pytest_collection_modifyitems`. See
# `docs/tech_debt/markers_migration.md` for the sunset schedule (2026-07-01).
markers =
    fast: Fast unit-level tests (canonical successor to phase4/6/7/8/9/10/11/12/13)
    integration: Integration tests across multiple modules
    regression: Regression / parity / invariant gates (canonical successor to phase_zero/speed/realism/depth)
    smoke: End-to-end smoke tests (full pipeline runs)
    slow: Slow-running tests (may take > 1 second)
    unit: Fast unit tests (legacy alias; prefer `fast`)
    external: Tests that require external services/network (excluded by default)
    phase4: Phase-4 — legacy, aliased to `fast`
    phase6: Phase-6 — legacy, aliased to `fast`
    phase7: Phase-7 — legacy, aliased to `fast`
    phase8: Phase-8 — legacy, aliased to `fast`
    phase9: Phase-9 — legacy, aliased to `fast`
    phase10: Phase-10 — legacy, aliased to `fast`
    phase11: Phase-11 — legacy, aliased to `fast`
    phase12: Phase-12 — legacy, aliased to `fast`
    phase13: Phase-13 — legacy, aliased to `fast`
    advanced: Advanced Analytics & Factor Labs tests (Phase A-E, optional)
    requires_scipy: Tests that require scipy (skipped if scipy not installed)
    requires_fastapi: Tests that require FastAPI/TestClient (skipped if fastapi not installed)
    requires_sklearn: Tests that require scikit-learn (skipped if sklearn not installed)
    chaos: Chaos / fault-injection tests (broker failures, data gaps, race conditions)
    property: Property-based tests using Hypothesis
    stress: Stress scenario replay tests
    phase_zero: E0 existential gates — legacy, aliased to `regression`
    phase_speed: B/C speed gates — legacy, aliased to `regression`
    phase_realism: E realism-calibration gates — legacy, aliased to `regression`
    phase_depth: F algo-depth gates — legacy, aliased to `regression`

# Default options
# Exclude external/slow tests by default for fast feedback
# Use -q (quiet) for faster output, use -v for verbose when needed
addopts = 
    -q
    --strict-markers
    -m "not external"
    --tb=short
    --disable-warnings

# Test output
console_output_style = progress

# Coverage (optional, if pytest-cov is installed)
# [tool:pytest]
# addopts = --cov=src/assembled_core --cov-report=term-missing

