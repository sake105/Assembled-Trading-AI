# pytest.ini - Pytest configuration for Assembled Trading AI
[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    slow: Slow-running tests (may take > 1 second)
    smoke: End-to-end smoke tests (full pipeline runs)
    unit: Fast unit tests (should run in < 1 second)
    integration: Integration tests (multiple modules)
    external: Tests that require external services/network (excluded by default)
    phase4: Phase-4-Backend-Tests (TA, QA-Metrics, Gates, Backtest, Reports, Pipelines)
    phase6: Phase-6-Event-Features (Insider, Congress, Shipping, News data and features)
    phase7: Phase-7-Labeling (Trade and equity curve labeling for ML)
    phase8: Phase-8-Portfolio-Risk (Portfolio risk metrics: VaR, ES, volatility)
    phase9: Phase-9-Tests (Model Governance & Validation)
    phase10: Phase-10-Tests (Pre-Trade & Kill-Switch)
    phase11: Phase-11-Tests (Core Module Unit Tests & Integration)
    phase12: Phase-12-Tests (Research & Experiment Tracking)
    phase13: Phase-13-Tests (M8 Evidence Engine — Fake-News Defense)
    advanced: Advanced Analytics & Factor Labs tests (Phase A-E, optional)
    requires_scipy: Tests that require scipy (skipped if scipy not installed)
    requires_fastapi: Tests that require FastAPI/TestClient (skipped if fastapi not installed)
    requires_sklearn: Tests that require scikit-learn (skipped if sklearn not installed)
    chaos: Chaos / fault-injection tests (broker failures, data gaps, race conditions)
    property: Property-based tests using Hypothesis
    regression: Regression tests against known-good KPI snapshots
    stress: Stress scenario replay tests
    phase_zero: E0 existential gates (parity, cost-tiers, atomic-save, reconcile-halt)
    phase_speed: B/C speed regression gates (1e-9 equity parity, wall-clock baselines)
    phase_realism: E realism-calibration gates (walk-forward, deflated-sharpe, fill parity)
    phase_depth: F algo-depth gates (IC-decay, regime-posterior, multi-timeframe)

# Default options
# Exclude external/slow tests by default for fast feedback
# Use -q (quiet) for faster output, use -v for verbose when needed
addopts = 
    -q
    --strict-markers
    -m "not external"
    --tb=short
    --disable-warnings

# Test output
console_output_style = progress

# Coverage (optional, if pytest-cov is installed)
# [tool:pytest]
# addopts = --cov=src/assembled_core --cov-report=term-missing

