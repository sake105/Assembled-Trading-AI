[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assembled-trading-core"
version = "0.0.1"
description = "Core backend for Assembled Trading AI - Data ingestion, signal generation, portfolio simulation, and order execution"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Assembled Trading AI Team"}
]
license = {text = "Proprietary"}
keywords = ["trading", "backtesting", "portfolio", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies (from requirements.txt)
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=10.0.0",
    "fastparquet>=2023.1.0",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "yfinance>=0.2.40",
    "alpaca-py>=0.30.0",
    "polygon-api-client>=1.12.0",
    "fredapi>=0.5.0",
    "edgartools>=2.0.0",
    "pytz>=2025.2",
    "tzdata>=2025.2",
    "fsspec>=2025.9.0",
    "cramjam>=2.11.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "exchange-calendars>=4.5.0",
    "newsapi-python>=0.2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "black==25.11.0",
  "mypy>=1.5.0",
  "tomli>=2.0.0",  # For reading pyproject.toml in tests (Python < 3.11)
  "hypothesis>=6.0.0",
]
ml = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
]
ml-boost = [
  "xgboost>=1.7.0",
  "lightgbm>=4.0.0",
  "catboost>=1.2.0",
]
ml-tune = [
  "optuna>=3.0.0",
  "scikit-learn>=1.3.0",
]
ml-explain = [
  "shap>=0.44.0",
  "scikit-learn>=1.3.0",
]
ml-nlp = [
  "transformers>=4.35.0",
  "torch>=2.0.0",
]
ml-hmm = [
  "hmmlearn>=0.3.0",
]
ml-online = [
  "river>=0.21.0",
]
scipy = [
  "scipy>=1.10.0",
]
intermarket = [
  "yfinance>=0.2.0",
  "pandas-datareader>=0.10.0",
]
historical-data = [
  "tqdm>=4.0.0",
  "pandas-datareader>=0.10.0",
]
all = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "xgboost>=1.7.0",
  "lightgbm>=4.0.0",
  "optuna>=3.0.0",
  "shap>=0.44.0",
  "hmmlearn>=0.3.0",
  "river>=0.21.0",
  "tqdm>=4.0.0",
  "scipy>=1.10.0",
  "yfinance>=0.2.0",
  "pandas-datareader>=0.10.0",
]
system_check = [
  "anthropic>=0.45.0",
  "PyYAML>=6.0",
]

[project.scripts]
assembled-cli = "scripts.cli:main"
assembled-run-backtest = "scripts.run_backtest_strategy:main"
assembled-run-daily = "scripts.run_eod_pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "scripts", "tests"]
line-length = 88

[tool.ruff.lint]
# Nur echte Fehler prüfen, keine Style-Warnungen
select = ["E", "F", "NPY201"]
ignore = ["E501", "E203", "E402"]  # E402: Module level import not at top (absichtlich in Tests nach sys.path.insert)

[tool.ruff.lint.isort]
known-first-party = ["assembled_core"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests", "scripts/tools"]
# B101: assert used intentionally in guards and tests
# B314: XML parsing of trusted gov/financial sources only (SEC EDGAR, House PTR).
#       No user-supplied XML. Migration to defusedxml tracked as Sprint 4 hardening.
skips = ["B101", "B314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
console_output_style = "progress"
addopts = "-q --strict-markers -m 'not external' --tb=short"
filterwarnings = [
  "error::DeprecationWarning:src.assembled_core.pipeline.*",
  "error::FutureWarning:src.assembled_core.*",
  "ignore::PendingDeprecationWarning",
  "ignore::ResourceWarning",
  "default::DeprecationWarning",
  "default::FutureWarning",
]
markers = [
  "fast: Fast unit-level tests (canonical successor to phase4/6/7/8/9/10/11/12/13)",
  "integration: Integration tests across multiple modules",
  "regression: Regression / parity / invariant gates (canonical successor to phase_zero/speed/realism/depth)",
  "smoke: End-to-end smoke tests (full pipeline runs)",
  "slow: Slow-running tests (may take > 1 second)",
  "unit: Fast unit tests (legacy alias; prefer fast)",
  "external: Tests that require external services/network (excluded by default)",
  "characterization: Golden-master / snapshot tests (deterministic, seeded)",
  "unwired_code: Tests for code defined but not yet wired into the production pipeline",
  "phase4: Phase-4 — legacy, aliased to fast",
  "phase6: Phase-6 — legacy, aliased to fast",
  "phase7: Phase-7 — legacy, aliased to fast",
  "phase8: Phase-8 — legacy, aliased to fast",
  "phase9: Phase-9 — legacy, aliased to fast",
  "phase10: Phase-10 — legacy, aliased to fast",
  "phase11: Phase-11 — legacy, aliased to fast",
  "phase12: Phase-12 — legacy, aliased to fast",
  "phase13: Phase-13 — legacy, aliased to fast",
  "advanced: Advanced Analytics and Factor Labs tests (Phase A-E, optional)",
  "requires_scipy: Tests that require scipy (skipped if scipy not installed)",
  "requires_fastapi: Tests that require FastAPI/TestClient (skipped if fastapi not installed)",
  "requires_sklearn: Tests that require scikit-learn (skipped if sklearn not installed)",
  "chaos: Chaos / fault-injection tests (broker failures, data gaps, race conditions)",
  "property: Property-based tests using Hypothesis",
  "stress: Stress scenario replay tests",
  "phase_zero: E0 existential gates — legacy, aliased to regression",
  "phase_speed: B/C speed gates — legacy, aliased to regression",
  "phase_realism: E realism-calibration gates — legacy, aliased to regression",
  "phase_depth: F algo-depth gates — legacy, aliased to regression",
]
