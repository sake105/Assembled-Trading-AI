[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assembled-trading-core"
version = "0.0.1"
description = "Core backend for Assembled Trading AI - Data ingestion, signal generation, portfolio simulation, and order execution"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Assembled Trading AI Team"}
]
license = {text = "Proprietary"}
keywords = ["trading", "backtesting", "portfolio", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies (from requirements.txt)
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=10.0.0",
    "fastparquet>=2023.1.0",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "yfinance>=0.2.40",
    "alpaca-py>=0.30.0",
    "polygon-api-client>=1.12.0",
    "fredapi>=0.5.0",
    "edgartools>=2.0.0",
    "pytz>=2025.2",
    "tzdata>=2025.2",
    "fsspec>=2025.9.0",
    "cramjam>=2.11.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "exchange-calendars>=4.5.0",
    "newsapi-python>=0.2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "black==25.11.0",
  "mypy>=1.5.0",
  "tomli>=2.0.0",  # For reading pyproject.toml in tests (Python < 3.11)
]
ml = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
]
ml-boost = [
  "xgboost>=1.7.0",
  "lightgbm>=4.0.0",
  "catboost>=1.2.0",
]
ml-tune = [
  "optuna>=3.0.0",
  "scikit-learn>=1.3.0",
]
ml-explain = [
  "shap>=0.44.0",
  "scikit-learn>=1.3.0",
]
ml-nlp = [
  "transformers>=4.35.0",
  "torch>=2.0.0",
]
ml-hmm = [
  "hmmlearn>=0.3.0",
]
scipy = [
  "scipy>=1.10.0",
]
intermarket = [
  "yfinance>=0.2.0",
  "pandas-datareader>=0.10.0",
]
all = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "xgboost>=1.7.0",
  "lightgbm>=4.0.0",
  "optuna>=3.0.0",
  "shap>=0.44.0",
  "hmmlearn>=0.3.0",
  "scipy>=1.10.0",
  "yfinance>=0.2.0",
  "pandas-datareader>=0.10.0",
]

[project.scripts]
assembled-cli = "scripts.cli:main"
assembled-run-backtest = "scripts.run_backtest_strategy:main"
assembled-run-daily = "scripts.run_eod_pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "scripts", "tests"]
line-length = 88

[tool.ruff.lint]
# Nur echte Fehler prüfen, keine Style-Warnungen
select = ["E", "F"]
ignore = ["E501", "E203", "E402"]  # E402: Module level import not at top (absichtlich in Tests nach sys.path.insert)

[tool.ruff.lint.isort]
known-first-party = ["assembled_core"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests", "scripts/tools"]
skips = ["B101"]  # assert used intentionally in guards and tests

[tool.pytest.ini_options]
markers = [
  "phase10: M5 Crisis Alpha tests",
  "phase11: M6 Risk v1.1 tests",
  "phase12: M7 Realism v2 and prior milestone tests",
  "phase13: M8 Evidence Engine tests",
  "slow: tests that are too slow for CI (run locally only)",
]
