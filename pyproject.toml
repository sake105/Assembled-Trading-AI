[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assembled-trading-core"
version = "0.0.1"
description = "Core backend for Assembled Trading AI - Data ingestion, signal generation, portfolio simulation, and order execution"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Assembled Trading AI Team"}
]
license = {text = "Proprietary"}
keywords = ["trading", "backtesting", "portfolio", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies (from requirements.txt)
dependencies = [
    # numpy/pandas floors are pinned to the requirements.txt versions (numpy==2.2.6,
    # pandas==2.2.3) so a local `pip install -e .[dev]` cannot resolve BELOW the CI
    # pin. A lower numpy ships looser stubs that miss numpy-2.x-strict mypy errors CI
    # catches → local mypy would pass while the blocking CI mypy gate fails (Rule-40
    # dep-drift). Kept as >= (not ==) so a newer numpy/pandas with even stricter stubs
    # is allowed: local-passes then implies CI-passes; only local-below-CI breaks, and
    # the raised floor now blocks that direction.
    "pandas>=2.2.3",
    "numpy>=2.2.6",
    "pyarrow>=10.0.0",
    "fastparquet>=2023.1.0",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    # Security floor: 2.6.3 clears CVE-2025-66418, CVE-2025-66471, CVE-2026-21441.
    # Transitive via requests/yfinance/alpaca-py/polygon-api-client; declared
    # explicitly so the minimum is enforced at the source-of-truth level.
    "urllib3>=2.6.3",
    "yfinance>=0.2.40",
    "alpaca-py>=0.30.0",
    "polygon-api-client>=1.12.0",
    "fredapi>=0.5.0",
    "edgartools>=2.0.0",
    "pytz>=2025.2",
    "tzdata>=2025.2",
    "fsspec>=2025.9.0",
    "cramjam>=2.11.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.139.0",
    "starlette>=1.3.1",  # security floor: fixes PYSEC-2026-161/248/249 + CVE-2026-48817/48818
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "exchange-calendars>=4.5.0",
    "newsapi-python>=0.2.7",
    "pandera>=0.21.0",
    "pandas-market-calendars>=4.6.0",
    "arch>=6.0.0",
    "PyYAML>=6.0",
    # Cross-process file lock used by ops/paper_ledger.py and
    # execution/kill_switch.py (OPS-04). Previously only transitively present;
    # the safety lock silently no-ops if it is absent, so declare it explicitly.
    "filelock>=3.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.14.0",
  "mypy>=1.5.0",
  "tomli>=2.0.0",  # For reading pyproject.toml in tests (Python < 3.11)
  "hypothesis>=6.0.0",
  "joblib>=1.3.0",  # parallel_grid + regression tests
]
ml = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
]
ml-boost = [
  "xgboost>=1.7.0",
  "lightgbm>=4.0.0",
  "catboost>=1.2.0",
]
ml-tune = [
  "optuna>=3.0.0",
  "scikit-learn>=1.3.0",
]
ml-explain = [
  "shap>=0.44.0",
  "scikit-learn>=1.3.0",
]
ml-nlp = [
  "transformers>=4.35.0",
  "torch>=2.0.0",
]
ml-hmm = [
  "hmmlearn>=0.3.0",
]
ml-online = [
  "river>=0.21.0",
]
scipy = [
  "scipy>=1.10.0",
]
perf = [
  "polars>=1.0",
  "numba>=0.60",
]
intermarket = [
  "yfinance>=0.2.0",
  "pandas-datareader>=0.10.0",
]
historical-data = [
  "tqdm>=4.0.0",
  "pandas-datareader>=0.10.0",
]
all = [
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "xgboost>=1.7.0",
  "lightgbm>=4.0.0",
  "optuna>=3.0.0",
  "shap>=0.44.0",
  "hmmlearn>=0.3.0",
  "river>=0.21.0",
  "tqdm>=4.0.0",
  "scipy>=1.10.0",
  "yfinance>=0.2.0",
  "pandas-datareader>=0.10.0",
  "polars>=1.0",
  "numba>=0.60",
]
system_check = [
  "anthropic>=0.45.0",
]

[project.scripts]
assembled-cli = "scripts.cli:main"
assembled-run-backtest = "scripts.run_backtest_strategy:main"
assembled-run-daily = "scripts.run_eod_pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "scripts", "tests"]
line-length = 88

[tool.ruff.lint]
# Nur echte Fehler prüfen, keine Style-Warnungen
select = ["E", "F", "NPY201"]
ignore = ["E501", "E203", "E402", "E702"]  # E402: module-level import not at top (intentional in tests after sys.path.insert); E702: multiple statements on one line — test files use `import pytest; pytest.importorskip(...)` pattern

[tool.ruff.lint.per-file-ignores]
"src/assembled_core/config/__init__.py" = ["F401"]  # re-export pattern: imports added to __all__ dynamically
"tests/**" = ["F841"]  # test helper variables assigned for side-effects or future assertions
"tests/*.py" = ["F841"]  # same, for flat test files

[tool.ruff.lint.isort]
known-first-party = ["assembled_core"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
# We do NOT set `mypy_path = "src"` — the codebase imports as
# `src.assembled_core.*` consistently (tests/conftest.py puts `src/` on
# sys.path so callers can use either style at runtime). Pointing mypy at
# `src/` makes the same files visible under two module names, and mypy
# refuses to type-check that. Use `explicit_package_bases` so mypy
# anchors at the repo root and treats `src.assembled_core.*` as the
# canonical namespace.
explicit_package_bases = true
namespace_packages = true
exclude = [
    "^src/assembled_trading_core\\.egg-info/",
    "^build/",
    "^dist/",
    "^\\.venv/",
]

# Subpath overrides — be lenient on third-party noise that lacks stubs.
# Declared runtime/test deps the local mypy 1.19.0 run could not resolve stubs
# for; they surface only as [import-untyped] noise (pyarrow/statsmodels/fredapi/
# polygon/exchange_calendars were unmasked once the [import-not-found] errors
# above them were silenced). All third-party — never a first-party module.
[[tool.mypy.overrides]]
module = [
    "pandas.*", "numpy.*", "scipy.*", "sklearn.*", "joblib.*", "yfinance.*",
    "fastapi.*", "syrupy.*", "hypothesis.*",
    "pyarrow.*", "statsmodels.*", "fredapi.*", "polygon.*", "exchange_calendars.*",
]
ignore_missing_imports = true

# Optional research / 3rd-party libraries that are not installed in the CI
# type-check environment (or ship without py.typed / stubs). They surface as
# [import-not-found] / [import-untyped] noise that drowns the real typing
# surface. Derived from the actual mypy run over
# data/features/signals/execution/portfolio (mypy 1.19.0) — NOT a hardcoded
# guess. NEVER wildcard, and NEVER a first-party assembled_core.* module:
# the missing first-party import `src.assembled_core.ml.conformal`
# (signals/meta_model.py) is a GENUINE issue and is intentionally left
# unsilenced here.
[[tool.mypy.overrides]]
module = [
    "backports.zoneinfo",
    "cvxpy.*",
    "dimod.*",
    "doubleml.*",
    "dtaidistance.*",
    "duckdb.*",
    "econml.*",
    "edgar.*",
    "filterpy.*",
    "lppls.*",
    "mapie.*",
    "mlfinpy.*",
    "mwviews.*",
    "openmeteo_requests.*",
    "pandas_datareader.*",
    "polars",
    "polars.*",
    "py_vollib.*",
    "py_vollib_vectorized.*",
    "pykalman.*",
    "riskfolio.*",
    "ruptures.*",
    "stumpy.*",
    "tsfresh.*",
]
ignore_missing_imports = true

# Strict overrides on the safety-critical subpaths added through the
# audit sweep — these surfaces MUST stay typed. Currently aspirational:
# the duplicate-module fix above is the prerequisite, individual
# annotations follow in a dedicated cleanup sprint.
[[tool.mypy.overrides]]
module = [
    "src.assembled_core.execution.kill_switch",
    "src.assembled_core.execution.order_lifecycle",
    "src.assembled_core.api.auth",
    "src.assembled_core.utils.retry",
    "src.assembled_core.utils.clock_drift",
    "src.assembled_core.reproducibility",
]
disallow_untyped_defs = true
warn_return_any = true

[tool.bandit]
exclude_dirs = ["tests", "scripts/tools"]
# B101: assert used intentionally in guards and tests
# B314: XML parsing of trusted gov/financial sources only (SEC EDGAR, House PTR).
#       No user-supplied XML. Migration to defusedxml tracked as Sprint 4 hardening.
# B310: urllib.request.urlopen used only with internal API URLs (BIS, Telegram webhook).
#       No user-supplied URLs; file:// risk is negligible in this context.
# B608: DuckDB f-string SQL used only with internal paths and validated config values.
#       No user-supplied SQL inputs; all view names, patterns, and ticker lists are
#       generated from internal configuration and validated universe lists.
skips = ["B101", "B314", "B310", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
console_output_style = "progress"
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
  "error::DeprecationWarning:src.assembled_core.pipeline.*",
  "error::FutureWarning:src.assembled_core.*",
  "ignore::PendingDeprecationWarning",
  "ignore::ResourceWarning",
  "default::DeprecationWarning",
  "default::FutureWarning",
]
markers = [
  "fast: Fast unit-level tests (canonical successor to phase4/6/7/8/9/10/11/12/13)",
  "integration: Integration tests across multiple modules",
  "regression: Regression / parity / invariant gates (canonical successor to phase_zero/speed/realism/depth)",
  "smoke: End-to-end smoke tests (full pipeline runs)",
  "slow: Slow-running tests (may take > 1 second)",
  "unit: Fast unit tests (legacy alias; prefer fast)",
  "characterization: Golden-master / snapshot tests (deterministic, seeded)",
  "unwired_code: Tests for code defined but not yet wired into the production pipeline",
  "advanced: Advanced Analytics and Factor Labs tests (Phase A-E, optional)",
  "audit_grep: source-grep audit checks, not behavioural tests",
  "chaos: Chaos / fault-injection tests (broker failures, data gaps, race conditions)",
  "property: Property-based tests using Hypothesis",
  "stress: Stress scenario replay tests",
  "phase_zero: E0 existential gates — legacy, aliased to regression",
  "phase_speed: B/C speed gates — legacy, aliased to regression",
  "phase_realism: E realism-calibration gates — legacy, aliased to regression",
  "phase_depth: F algo-depth gates — legacy, aliased to regression",
]
