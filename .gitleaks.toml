# gitleaks configuration for Assembled-Trading-AI
# See https://github.com/gitleaks/gitleaks for syntax.
#
# We extend the default ruleset and keep narrow allowlists for doc/test
# placeholder strings and volatile output/data directories. `.env` is
# DELIBERATELY NOT ALLOWLISTED so that any new commit of `.env` fails the
# scanner (P0 finding A1, System-Check Deep Run v2, 2026-04-18). See
# docs/incidents/2026-04-18_env_exposure.md for the rotation status and
# history-rewrite decision.

title = "Assembled-Trading-AI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlist for known-safe artifacts"

paths = [
    '''\.secrets\.baseline$''',
    '''CHANGELOG_DUE_DILIGENCE\.md$''',
    '''\.venv/.*''',
    '''output/.*''',
    '''data/.*''',
    '''\.git/.*''',
    '''tests/test_data_finnhub_events_client\.py$''',
    '''tests/test_data_finnhub_news_macro_client\.py$''',
    '''docs/INTEGRATION_PLAN_ALTERNATIVE_APIS\.md$''',
    '''docs/WORKFLOWS_EVENT_STUDIES\.md$''',
    '''docs/backend_core\.md$''',
]
